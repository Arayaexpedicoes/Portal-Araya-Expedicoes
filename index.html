<style>
/* Layout: faixa escura da marca no topo (título + abas), conteúdo claro em coluna única de até 1120px; cada destino carrega a cor do logo dele */
:root{
  --bg:#f6f1e8; --surface:#fffdf8; --surface-2:#efe7da; --line:#e3d9c8;
  --fg:#38331f; --muted:#7a725d; --accent:#6f6a45; --accent-ink:#fffdf8; --accent-soft:#ebe6d3;
  --band:#ece2d0; --band-2:#e2d5be; --band-fg:#4a4530; --band-muted:#857c63; --logo:#7c7650;
  --ok:#3f7a4c; --ok-soft:#e1eedd; --warn:#94650a; --warn-soft:#f5e8cc; --bad:#a63d2f; --bad-soft:#f4dcd6; --info:#3c6a86; --info-soft:#dfe9ef;
  --d-cusco:#4e7f57; --d-patagonia:#3f6f93; --d-egito:#b08b5c; --d-japao:#b35a3b; --d-mendoza:#7c2f42; --d-atacama:#c0763a; --d-outro:#8a8470;
  --display:"Noto Serif", Georgia, "Times New Roman", serif;
  --body:"Montserrat", "Gotham", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:12px; --shadow:0 1px 2px rgb(74 69 48 / .06), 0 4px 14px rgb(74 69 48 / .06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17150f; --surface:#211e17; --surface-2:#2a261d; --line:#383226;
  --fg:#ede6d6; --muted:#a79f88; --accent:#c9c095; --accent-ink:#1d1b12; --accent-soft:#34301f;
  --band:#221f17; --band-2:#2e2a1f; --band-fg:#ede6d6; --band-muted:#a79f88; --logo:#cfc59c;
  --ok:#7cc48f; --ok-soft:#1d3323; --warn:#e2b04b; --warn-soft:#382d13; --bad:#ef8476; --bad-soft:#3d1d19; --info:#8bb8d6; --info-soft:#1d3240;
  --d-cusco:#7db88a; --d-patagonia:#7fadd2; --d-egito:#d9bb90; --d-japao:#e08a69; --d-mendoza:#d07b8f; --d-atacama:#e2a16a; --d-outro:#a9a28c;
  --shadow:0 1px 2px rgb(0 0 0 / .3);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#17150f; --surface:#211e17; --surface-2:#2a261d; --line:#383226;
  --fg:#ede6d6; --muted:#a79f88; --accent:#c9c095; --accent-ink:#1d1b12; --accent-soft:#34301f;
  --band:#221f17; --band-2:#2e2a1f; --band-fg:#ede6d6; --band-muted:#a79f88; --logo:#cfc59c;
  --ok:#7cc48f; --ok-soft:#1d3323; --warn:#e2b04b; --warn-soft:#382d13; --bad:#ef8476; --bad-soft:#3d1d19; --info:#8bb8d6; --info-soft:#1d3240;
  --d-cusco:#7db88a; --d-patagonia:#7fadd2; --d-egito:#d9bb90; --d-japao:#e08a69; --d-mendoza:#d07b8f; --d-atacama:#e2a16a; --d-outro:#a9a28c;
  --shadow:0 1px 2px rgb(0 0 0 / .3);
  color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0;letter-spacing:-.005em;line-height:1.25}
h1{font-size:1.3rem} h2{font-size:1.45rem} h3{font-size:1.08rem}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* faixa da marca */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--band);color:var(--band-fg);overflow:hidden}
header.top .ridge{position:absolute;right:0;bottom:0;width:min(560px,70%);height:100%;pointer-events:none;opacity:.35}
header.top{border-bottom:1px solid var(--line)}
.brand .logo{height:54px;width:auto;flex:none;color:var(--logo);display:block}
.brand .divider{width:1px;align-self:stretch;background:color-mix(in srgb, var(--band-fg) 18%, transparent);margin-block:6px}
.brand h1{font-size:1.25rem;color:var(--band-fg)}
@media (max-width:520px){.brand .logo{height:42px}.brand h1{font-size:1.05rem}}
.auth-logo{display:flex;justify-content:center;color:var(--logo);padding-bottom:4px}
.auth-logo svg{height:96px;width:auto}
header.top .wrap{position:relative}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 10px}
.brand .mark{display:flex;align-items:center;gap:12px;min-width:0}
.brand .mark svg{flex:none}
.brand .eyebrow{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--band-muted);font-weight:600}
.who{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--band-muted);min-width:0;background:color-mix(in srgb, var(--band-fg) 7%, transparent);border-radius:99px;padding:6px 14px}
.who:empty{display:none}
.who img{width:28px;height:28px;border-radius:50%}
.who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--band-fg)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;border-radius:99px;padding:7px 14px;color:var(--band-muted);font-weight:600;font-size:.86rem;white-space:nowrap;cursor:pointer;transition:background .15s,color .15s}
nav.tabs button[aria-current="true"]{color:var(--band);background:var(--band-fg)}
nav.tabs button:hover:not([aria-current="true"]){color:var(--band-fg);background:color-mix(in srgb, var(--band-fg) 8%, transparent)}
main{padding-block:26px 64px;display:grid;gap:22px}
.banner{background:var(--info-soft);color:var(--fg);border-radius:var(--r);padding:11px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.section-head > div{min-width:0}
.section-head p{margin:5px 0 0;color:var(--muted);max-width:65ch}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.tile{background:var(--surface);border-radius:var(--r);padding:16px 18px;display:grid;gap:4px;align-content:start;box-shadow:var(--shadow)}
.tile .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--display);font-size:1.85rem;font-weight:600;font-variant-numeric:tabular-nums lining-nums;line-height:1.15}
.tile .d{font-size:.82rem;color:var(--muted)}
.tile.feature{background:var(--band-2);color:var(--band-fg)}
.tile.feature .k,.tile.feature .d{color:var(--band-muted)}
.panel{background:var(--surface);border-radius:var(--r);padding:18px;display:grid;gap:14px;min-width:0;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.tablewrap{overflow-x:auto;min-width:0}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.9rem}
th{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover td{background:color-mix(in srgb, var(--surface-2) 45%, transparent)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
tfoot td{font-weight:700;border-top:1px solid var(--line)}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.dest{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted)}
.dest::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dc,var(--d-outro));flex:none}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:60px}
.bar > i{display:block;height:100%;border-radius:inherit;background:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.neutral{background:var(--surface-2);color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:99px;padding:7px 15px;font-weight:600;cursor:pointer;font-size:.86rem;white-space:nowrap;transition:background .15s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:4px 11px;font-size:.8rem}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-width:0;width:100%}
.section-head select,.section-head input[type=search]{background:var(--surface);box-shadow:var(--shadow);border-color:transparent}
input.cell{width:84px;text-align:right;padding:5px 8px}
.mescoms{min-width:0}
details.mescom{border-top:1px solid var(--line);min-width:0;max-width:100%}
details.mescom:first-of-type{border-top:0}
details.mescom > summary{list-style:none;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 4px;cursor:pointer;border-radius:8px}
details.mescom > summary::-webkit-details-marker{display:none}
details.mescom > summary:hover{background:color-mix(in srgb, var(--surface-2) 50%, transparent)}
details.mescom > summary .t{display:flex;gap:10px;align-items:center;min-width:0}
details.mescom > summary .t::before{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none;margin-right:2px}
details.mescom[open] > summary .t::before{transform:rotate(45deg)}
details.mescom > summary .v{display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap;white-space:nowrap}
details.mescom .tablewrap{padding:0 0 12px}
.mescom .so-cel,.orclista .so-cel{display:none}
.orclista .acoes{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.orclista .so-cel.acoes{display:none}
@media (max-width:640px){ .orclista .px,.orclista .lk,.orclista .vd,.orclista .ac,.orclista .vg{display:none} .orclista .so-cel.acoes{display:flex;justify-content:flex-end;margin-top:6px} .orclista .so-cel{display:block;margin-top:4px} .orclista td.n{white-space:nowrap} }
@media (max-width:640px){ .mescom .vg,.mescom .st{display:none} .mescom .so-cel{display:block;margin-top:4px} .mescom td.n{white-space:nowrap} }
tbody tr.sel td{background:color-mix(in srgb, var(--accent-soft) 60%, transparent)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
input.cell[readonly]{background:transparent;border-color:transparent;box-shadow:none;cursor:default}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--muted);display:grid;gap:6px;justify-items:center}
.empty strong{color:var(--fg);font-family:var(--display);font-weight:600;font-size:1.02rem}
.member{display:grid;grid-template-columns:auto 1fr;gap:12px 14px;align-items:start;padding:16px 0;border-bottom:1px solid var(--line)}
.member:last-child{border-bottom:0}
.member img{width:42px;height:42px;border-radius:50%}
.member .body{display:grid;gap:10px;min-width:0}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.toggle{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:99px;padding:4px 12px 4px 7px;font-size:.84rem;cursor:pointer;user-select:none;background:var(--surface)}
.toggle input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.toggle:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.overlay{position:fixed;inset:0;background:rgb(8 18 14 / .5);z-index:20;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{background:var(--surface);border-radius:16px;max-width:640px;width:100%;max-height:100%;overflow:auto;padding:22px;display:grid;gap:16px;box-shadow:0 20px 50px rgb(0 0 0 / .25)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;font-size:.88rem;z-index:30;max-width:calc(100% - 32px)}
/* Passeios */
.tour{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:16px;align-items:start}
@media (max-width:760px){.tour{grid-template-columns:1fr}}
.subnav{display:inline-flex;gap:4px;background:var(--surface-2);border-radius:99px;padding:4px;justify-self:start;max-width:100%;overflow-x:auto}
.subnav button{border:0;background:none;padding:7px 18px;border-radius:99px;font:inherit;font-weight:600;font-size:.88rem;color:var(--muted);cursor:pointer;white-space:nowrap}
.subnav button:hover{color:var(--fg)}
.subnav button[aria-current="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px 6px 10px;font-weight:600;font-size:.86rem;cursor:pointer}
.chip::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--dc,var(--d-outro))}
.chip[aria-pressed="true"]{background:var(--dc,var(--accent));border-color:var(--dc,var(--accent));color:var(--surface)}
.chip[aria-pressed="true"]::before{background:var(--surface)}
.chip.todos{padding-left:14px}
.chip.todos::before{display:none}
.tourlist{display:grid;gap:2px;max-height:70vh;overflow:auto;padding:4px}
.tourlist button{text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;line-height:1.35}
.tourlist button:hover{background:var(--surface-2)}
.tourlist button[aria-current="true"]{background:color-mix(in srgb, var(--dc,var(--accent)) 16%, transparent);font-weight:600}
.tourlist .grp{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;padding:10px 10px 2px}
.tourhead{display:grid;gap:4px}
.tourhead .dest{font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.7rem;color:var(--dc,var(--muted))}
.prose{min-width:0;overflow-wrap:anywhere}
.prose > :not(.galeria):not(.vgrade):not(.video){max-width:70ch}
.prose > .video{max-width:760px}
.prose h4{font-family:var(--display);font-weight:600;font-size:1.02rem;margin:20px 0 4px}
.prose h5{font-size:.9rem;margin:14px 0 2px}
.prose p{margin:0 0 8px}
.prose ul,.prose ol{margin:0 0 10px;padding-left:20px}
.prose li{margin:2px 0}
.prose li.sub{margin-left:18px;list-style:circle}
.prose > :first-child{margin-top:0}
.tourlist .tcat{display:block;font-size:.7rem;color:var(--muted);font-weight:500;letter-spacing:.02em}
.prose blockquote{margin:6px 0 10px;padding:9px 13px;border-left:3px solid var(--dc,var(--accent));background:color-mix(in srgb, var(--dc,var(--accent)) 8%, transparent);border-radius:0 8px 8px 0}
/* Fotos e vídeos */
.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin:6px 0 12px}
.galeria.uma{grid-template-columns:1fr;max-width:620px}
.galeria button{border:0;padding:0;background:var(--surface-2);border-radius:10px;overflow:hidden;cursor:zoom-in;display:grid;aspect-ratio:4/3;position:relative}
.galeria.uma button{aspect-ratio:auto;max-height:460px}
.galeria img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .25s}
.galeria img.ok{opacity:1}
.galeria figcaption{position:absolute;left:0;right:0;bottom:0;padding:16px 10px 7px;font-size:.76rem;color:#fff;text-align:left;background:linear-gradient(transparent,rgb(0 0 0 / .6))}

const AUTH_ERR = (e) => {
  const c = (e && e.code) || "";
  if (/invalid-credential|wrong-password|user-not-found|invalid-login-credentials/.test(c)) return "E-mail ou senha incorretos.";
  if (/too-many-requests/.test(c)) return "Muitas tentativas seguidas. Espere alguns minutos e tente de novo.";
  if (/user-disabled/.test(c)) return "Este login foi desativado. Fale com a Letícia.";
  if (/invalid-email/.test(c)) return "Digite um e-mail válido.";
  if (/network-request-failed/.test(c)) return "Sem conexão. Confira a internet e tente de novo.";
  return "Não deu certo agora. Tente de novo em instantes.";
};
const portalUrl = () => location.origin + location.pathname;
async function sendLink(email) {
  try { await S.auth.sendPasswordResetEmail(email, { url: portalUrl() }); }
  catch (e) {
    if (e && /continue-uri|unauthorized-domain/.test(e.code || "")) await S.auth.sendPasswordResetEmail(email);
    else throw e;
  }
}

// Comparativo do vendedor: mês atual (em andamento) contra os 2 ou 4 meses anteriores, no mês inteiro e no mesmo período (até o mesmo dia)
function comparativoPainel(ativas, hoje) {
  const n = S.filtros.compN === "2" ? 2 : 4, dia = new Date().getDate();
  const linhas = Array.from({ length: n + 1 }, (_, i) => addM(hoje, -i)).map(m => {
    const l = ativas.filter(v => ymOf(v.fechamento) === m), ate = l.filter(v => +String(v.fechamento).slice(8, 10) <= dia);
    return { m, q: l.length, v: l.reduce((s, x) => s + (Number(x.valor) || 0), 0), vAte: ate.reduce((s, x) => s + (Number(x.valor) || 0), 0), qAte: ate.length };
  });
  const [cur, ...ant] = linhas, prev = ant[0], mx = Math.max(1, ...linhas.map(x => x.v));
  const pct = (a, b) => b ? Math.round((a - b) / b * 100) : null;
  const seta = (a, b) => { const p = pct(a, b); return p == null ? (a ? '<span class="pill ok">novo</span>' : '<span class="muted">—</span>') : `<span class="${p > 0 ? "pos" : p < 0 ? "neg" : ""}">${p > 0 ? "▲" : p < 0 ? "▼" : "="} ${Math.abs(p)}%</span>`; };
  const nomeM = (m) => MESES_L[+m.slice(5) - 1];
  const melhor = ant.reduce((a, x) => x.v > a.v ? x : a, ant[0]);
  const passou = ant.filter(x => x.v > 0 && cur.v > x.v);
  const pP = pct(cur.vAte, prev.vAte);
  const frases = [
    `Até hoje (dia ${dia}), você vendeu <strong>${money(cur.v)}</strong> em ${cur.q} ${cur.q === 1 ? "venda" : "vendas"}.`,
    prev.vAte || cur.vAte ? (pP == null ? `No mesmo período de ${nomeM(prev.m)} você ainda não tinha vendas.` : pP === 0 ? `Igual ao mesmo período de ${nomeM(prev.m)}.` : `${pP > 0 ? "▲ " + pP + "% a mais" : "▼ " + Math.abs(pP) + "% a menos"} que no mesmo período de ${nomeM(prev.m)} (${money(prev.vAte)} até o dia ${dia}).`) : "",
    passou.length ? `Você já passou o total de ${passou.map(x => nomeM(x.m)).join(", ").replace(/, ([^,]*)$/, " e $1")}. 🎉` : prev.v ? `Para igualar ${nomeM(prev.m)} inteiro, faltam <strong>${money(Math.max(0, prev.v - cur.v))}</strong>.` : "",
    melhor && melhor.v ? `Seu melhor mês no período: <strong>${nomeM(melhor.m)}</strong>, com ${money(melhor.v)}.` : ""
  ].filter(Boolean);
  return `<section class="panel"><div class="section-head"><div><h3>Comparativo dos últimos meses</h3><span class="muted small">Valor vendido pela data de fechamento. Como ${nomeM(hoje)} ainda está em andamento, a coluna “Até o dia ${dia}” compara o mesmo período de cada mês.</span></div>
    <nav class="subnav" aria-label="Período do comparativo">${[["2", "2 meses"], ["4", "4 meses"]].map(([k, t]) => `<button type="button" data-compn="${k}" aria-current="${String(n) === k}">${t}</button>`).join("")}</nav></div>
    <div class="comp-frases">${frases.map(f => `<p>${f}</p>`).join("")}</div>
    <div class="tablewrap"><table class="comp"><thead><tr><th>Mês</th><th class="n qcol">Vendas</th><th class="n">Valor vendido</th><th class="barcol"></th><th class="n">Até o dia ${dia}</th><th class="n">vs mês anterior</th></tr></thead><tbody>
    ${linhas.map((x, i) => { const base = linhas[i + 1]; return `<tr class="${i === 0 ? "atual" : ""} ${x === melhor && x.v ? "melhor" : ""}"><td><strong>${ymLabel(x.m)}</strong>${i === 0 ? ' <span class="pill info">em andamento</span>' : x === melhor && x.v ? ' <span class="pill ok">melhor</span>' : ""}</td><td class="n qcol">${x.q}</td><td class="n">${money(x.v)}</td><td class="barcol"><div class="bar"><i style="width:${Math.round(x.v / mx * 100)}%"></i></div></td><td class="n">${money(x.vAte)}</td><td class="n">${base ? (i === 0 ? seta(x.vAte, base.vAte) : seta(x.v, base.v)) : '<span class="muted">—</span>'}</td></tr>`; }).join("")}
    </tbody></table></div>
    <p class="muted small" style="margin:0">No mês atual, a comparação com o anterior é feita até o mesmo dia; nos meses fechados, pelo mês inteiro.</p>
  </section>`;
}

function comissoesPorMesPainel(ativas, hoje) {
  const meses = Array.from({ length: 7 }, (_, i) => addM(hoje, i - 2));
  const blocos = meses.map(m => {
    const vs = ativas.filter(v => v.mesRef === m).sort((a, b) => (a.retorno || a.embarque || "").localeCompare(b.retorno || b.embarque || ""));
    const conta = vs.filter(v => !v.naoProgramado), total = conta.reduce((s, v) => s + v.comissao, 0), pagoEm = addM(m, 1);
    const st = !vs.length ? "" : conta.length && conta.every(v => v.pagaEm) ? '<span class="pill ok">Paga</span>' : pagoEm <= hoje ? '<span class="pill warn">A receber</span>' : m === hoje ? '<span class="pill info">Em andamento</span>' : '<span class="pill neutral">Prevista</span>';

function md(src, fotos = {}, arqs = {}) {
  let out = "", list = null, gal = [], vids = [];
  const fechaVid = () => { if (vids.length) { out += `<div class="vgrade">${vids.map(id => videoNotionHtml(arqs[id])).join("")}</div>`; vids = []; } };
  const fechaGal = () => { if (gal.length) { out += `<div class="galeria${gal.length === 1 ? " uma" : ""}">${gal.map(id => { const f = fotos[id] || {}; return `<button type="button" data-foto="${esc(id)}" aria-label="Ampliar foto${f.legenda ? ": " + esc(f.legenda) : ""}"><img data-midia="${esc(id)}" alt="${esc(f.legenda || "")}">${f.legenda ? `<figcaption>${esc(f.legenda)}</figcaption>` : ""}</button>`; }).join("")}</div>`; gal = []; } };
  const close = () => { if (list) { out += `</${list}>`; list = null; } };
  for (const raw of String(src || "").split("\n")) {
    const t = raw.trim(); let m;
    if ((m = t.match(/^\[\[foto:([A-Za-z0-9_-]+)\]\]$/))) { close(); fechaVid(); gal.push(m[1]); continue; }
    fechaGal();
    if ((m = t.match(/^\[\[nvideo:([A-Za-z0-9_-]+)\]\]$/))) { close(); if (arqs[m[1]]) vids.push(m[1]); continue; }
    fechaVid();
    if ((m = t.match(/^\[\[arquivo:([A-Za-z0-9_-]+)\]\]$/))) { close(); const a = arqs[m[1]]; if (a && a.url) out += `<a class="arquivo" href="${esc(a.url)}" target="_blank" rel="noopener">📄 ${esc(a.legenda || a.nome || "Abrir arquivo")}</a>`; continue; }
    if ((m = t.match(/^\[\[video:(youtube|drive|vimeo):([A-Za-z0-9_-]+)(?:\|([^\]]*))?\]\]$/))) {
      close(); out += `<div class="video"><iframe src="${VIDEO_URL[m[1]](m[2])}" title="${esc(m[3] || "Vídeo")}" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>${m[3] ? `<p class="video-leg">${esc(m[3])}</p>` : ""}`; continue;
    }
    if (!t) { close(); continue; }
    if ((m = t.match(/^(#{2,6})\s+(.*)$/))) { close(); const lv = m[1].length <= 3 ? "h4" : "h5"; out += `<${lv}>${mdInline(m[2])}</${lv}>`; continue; }
    if ((m = t.match(/^>\s?(.*)$/))) { close(); out += `<blockquote>${mdInline(m[1])}</blockquote>`; continue; }

    close(); out += `<p>${mdInline(t)}</p>`;
  }
  close(); fechaGal(); fechaVid(); return out;
}

function acoesDoTexto(txt) {
  const vistos = new Set(), sites = [], emails = [], zaps = [];
  const addSite = (u) => { u = u.replace(/[.,;:)]+$/, ""); if (!vistos.has(u)) { vistos.add(u); sites.push(u); } };
  String(txt || "").replace(/\[[^\]]*\]\((https?:\/\/[^)\s]+)\)/g, (m, u) => addSite(u)).replace(/(^|[^(])\b(https?:\/\/[^\s)\]]+)/g, (m, a, u) => addSite(u));
  for (const m of String(txt || "").matchAll(/[\w.+-]+@[\w-]+(?:\.[\w-]+)+/g)) if (!vistos.has(m[0]) && !/araya/i.test(m[0])) { vistos.add(m[0]); emails.push(m[0]); }
  for (const m of String(txt || "").matchAll(/\+\s?\d[\d\s()\-\u202a\u202c]{8,}\d/g)) { const n = m[0].replace(/\D/g, ""); if (n.length >= 10 && n.length <= 15 && !vistos.has(n)) { vistos.add(n); zaps.push([n, "+" + m[0].replace(/[^\d\s]/g, "").trim()]); } }
  return { sites: sites.filter(u => !/wa\.me|notion\.(so|com)/.test(u)), emails, zaps };
}

async function carregarEscala() {

  S.escala = E; _ferCache = {};

  }

  if (S.isAdmin && !E.erro && !E.cfgExiste) {

    if (ids.length) { E.cfg = { ancora: ANCORA_PADRAO, feriadosExtra: "", inicioPonto: isoDia(new Date()), pessoas: Object.fromEntries(ids.map(u => [u, { nome: label(u), ...horarioPadrao(label(u)) }])) }; try { await col("config").doc("escala").set(E.cfg); E.cfgExiste = true; } catch (_) {} }
  }
}

function destinoDaCampanha(c) {
  const n = semAcento([c.campaign, c.content, c.headline].join(" "));
  if (/cusco|machu|peru|inca/.test(n)) return "Cusco e Machu Picchu";
  if (/patag|torres|calafate|chalten/.test(n)) return "Patagônia";
  if (/ushuaia/.test(n)) return "Ushuaia";
  if (/egito|egypt|jordan|cairo/.test(n)) return "Egito e Jordânia";
  if (/japao|japan|toquio|tokyo|kyoto/.test(n)) return "Japão";
  if (/mendoza/.test(n)) return "Mendoza";
  if (/atacama|uyuni/.test(n)) return "Atacama e Uyuni";
  return "Geral / outros";
}

    <p class="small" id="v-erro" style="color:var(--bad);margin:0" hidden></p>
    <div class="row" style="justify-content:space-between">
      <div>${v ? `<button type="button" class="btn danger" data-act="excluir-venda" data-id="${esc(v.id)}">Excluir venda</button>` : ""}</div>
      <div class="row"><button type="button" class="btn" data-close-btn>Cancelar</button><button type="submit" class="btn primary">${v ? "Salvar alterações" : "Lançar venda"}</button></div>
    </div>
  </form></div>`;
  const form = $("#venda-form");
  const upd = () => {
    const valor = Number($("#v-valor").value) || 0, p = Number($("#v-pct").value) || 0, fim = $("#v-ret").value || $("#v-emb").value;
    $("#v-preview").textContent = fim ? `Comissão de ${money(valor * p / 100)}, paga em ${ymLong(addM(ymOf(fim), 1))} (mês seguinte ao fim da viagem).` : "Informe as datas da viagem para calcular quando a comissão será paga.";

    if (row.retorno && row.retorno < row.embarque) { erro.hidden = false; erro.textContent = "A data de volta está antes da chegada. Confira as datas."; return; }
    const btn = form.querySelector("[type=submit]"); btn.disabled = true;

  });
}

$("#main").addEventListener("submit", async (e) => {
  if (e.target.id !== "add-form") return;
  e.preventDefault();
  const email = $("#n-email").value.trim().toLowerCase(), apelido = $("#n-apelido").value.trim(), p = $("#n-pct").value;
  const erro = $("#add-erro");
  if (!emailOk(email)) { erro.textContent = "Digite um e-mail válido."; erro.style.color = "var(--bad)"; return; }
  if (S.members[email]) { erro.textContent = "Esse e-mail já está cadastrado."; erro.style.color = "var(--bad)"; return; }
  const semEmail = $("#n-semail").checked, senhaIni = ($("#n-senha").value || "").trim();
  if (semEmail && senhaIni.length < 8) { erro.textContent = "Defina uma senha inicial com pelo menos 8 caracteres (ou clique em Gerar)."; erro.style.color = "var(--bad)"; return; }
  const btn = e.target.querySelector("[type=submit]"); btn.disabled = true;
  erro.style.color = "var(--muted)"; erro.textContent = "Criando o login…";
  try {
    const sec = firebase.apps.find(a => a.name === "cadastro") || firebase.initializeApp(FIREBASE_CONFIG, "cadastro");
    const bytes = crypto.getRandomValues(new Uint8Array(24));
    const tmp = semEmail ? senhaIni : Array.from(bytes, x => x.toString(16).padStart(2, "0")).join("") + "Aa1!";
    const cred = await sec.auth().createUserWithEmailAndPassword(email, tmp);
    const uid = cred.user.uid; await sec.auth().signOut();
    await col("equipe").doc(email).set({ apelido, pct: p === "" ? null : Math.max(0, Math.min(100, Number(p))), abas: { ...ABAS_PADRAO }, ativo: true, uid, semEmail, criadoEm: new Date().toISOString() });
    if (semEmail) { await reload("Pessoa cadastrada."); mostrarSenhaCriada(email, senhaIni, "Login criado"); return; }
    let aviso = "Pessoa cadastrada. Ela recebeu um e-mail para criar a senha.";
    try { await sendLink(email); } catch (_) { aviso = "Pessoa cadastrada, mas o e-mail de senha não saiu. Use “Reenviar link de senha”."; }
    await reload(aviso);
  } catch (err) {
    btn.disabled = false; erro.style.color = "var(--bad)";
    erro.textContent = err && err.code === "auth/email-already-in-use"
      ? "Esse e-mail já tem um login no Firebase. Se for de um cadastro antigo, apague esse usuário em Authentication → Users no Firebase e cadastre de novo."

});

    const d = { roteiro: idv, cliente, telefone: v_(l, "telefone").replace(/[^\d+]/g, ""), link, status: v_(l, "status"), criado: lerData(v_(l, "criado")), chegada: lerData(v_(l, "cheg")), partida: lerData(v_(l, "part")), pax: Number(v_(l, "pax")) || null, valor: lerMoeda(v_(l, "total")), destino: DEST_CRM(v_(l, "destino")), vendedor, vendedorNome: v_(l, "vend"), casa, naPlanilha: true };
    if (antigo && !d.criado && antigo.criado) d.criado = antigo.criado;
    const mudou = !antigo || Object.keys(d).some(k => JSON.stringify(antigo[k] ?? null) !== JSON.stringify(d[k] ?? null));
    if (!mudou) continue;
    if (!antigo) { d.vistoEm = ctx.hojeD; d.base = semHistorico; novos++; } else alterados++;
    escritas.push([id, d]);
  }
  // saíram da planilha (viraram venda, foram cancelados ou apagados): ficam no histórico, mas não contam como "em aberto"
  for (const [id, o] of Object.entries(antigos)) if (!vistos.has(id) && o.naPlanilha !== false) escritas.push([id, { naPlanilha: false }]);
  return { linhas: linhas.length - 1, novos, alterados, escritas, temData: ix.criado >= 0 };
}
// Trava de segurança da planilha de vendas: antes de aplicar, compara com a leitura anterior.
// Se sumiram colunas essenciais ou caiu muito o número de vendas recentes, a leitura fica pausada até a administradora confirmar.
const COLUNAS_ESSENCIAIS = ["data da venda", "roteiro", "cliente", "vendedor(a)", "status", "partida", "valor final r$", "origem"];
function assinaturaPlanilha(txt, hojeD) {
  const linhas = lerCSV(txt), cab = (linhas[0] || []).map(semAcento), iData = cab.findIndex(h => h === "data da venda" || h.startsWith("data da venda"));
  const corte = new Date(Date.parse((hojeD || new Date().toISOString().slice(0, 10)) + "T12:00:00Z") - 120 * 864e5).toISOString().slice(0, 10);
  let total = 0, recentes = 0;
  for (const l of linhas.slice(1)) { const d = iData >= 0 ? lerData(l[iData]) : ""; if (!d) continue; total++; if (d >= corte) recentes++; }
  return { colunas: cab.filter(c => COLUNAS_ESSENCIAIS.includes(c)), total, recentes };
}
function motivoBloqueio(nova, antiga) {
  if (!antiga || !nova) return "";
  const sumiram = (antiga.colunas || []).filter(c => !(nova.colunas || []).includes(c));
  if (sumiram.length) return "a planilha nova não tem as colunas " + sumiram.map(c => "“" + c + "”").join(", ") + ", que existiam na leitura anterior";
  if ((antiga.recentes || 0) >= 10 && nova.recentes < antiga.recentes * 0.8) return "a planilha nova tem " + nova.recentes + " vendas dos últimos 4 meses, contra " + antiga.recentes + " na leitura anterior";
  return "";
}
// <<< COMUM-TREVOR
async function baixarPlanilha(link, nome) {
  const url = urlPlanilha(link); if (!url) return null;
  try { const r = await fetch(url); const txt = await r.text(); if (!r.ok) throw new Error("http"); return txt; }
  catch (_) { throw new Error(`A planilha de ${nome} não abriu. Confira se ela está compartilhada como “Qualquer pessoa com o link: Leitor”.`); }
}
async function gravarLotes(colecao, escritas) {
  for (let i = 0; i < escritas.length; i += 400) {
    const lote = S.db.batch();
    escritas.slice(i, i + 400).forEach(([id, d]) => lote.set(col(colecao).doc(id), d, { merge: true }));
    await lote.commit();
  }
}
async function importarTrevor(silencioso, forcar) {
  const c = S.comercial;
  if (!urlPlanilha(c.planilha)) { if (!silencioso) toast("Cole o link da planilha do Trevor primeiro."); return; }
  S.importando = true; if (!silencioso) render();
  try {
    const txtV = await baixarPlanilha(c.planilha, "vendas");
    const assin = assinaturaPlanilha(txtV, isoDia(new Date())), motivo = forcar ? "" : motivoBloqueio(assin, c.planilhaAssinatura);
    if (motivo) {
      const bloqueio = { em: new Date().toISOString(), motivo, por: "portal" };
      S.comercial.importacaoBloqueada = bloqueio; await col("config").doc("comercial").set({ importacaoBloqueada: bloqueio }, { merge: true });
      S.importando = false; if (!silencioso) toast("Leitura pausada: " + motivo + "."); render(); return;
    }
    const rv = prepararVendas(txtV, { antigas: S.vendas, membros: S.members, cotacoes: c.cotacoes });
    await gravarLotes("vendas", rv.escritas);
    const resultado = { linhas: rv.linhas, novas: rv.novas, alteradas: rv.alteradas, ignoradas: rv.ignoradas, em: new Date().toISOString() };
    S.comercial.ultimaImportacao = resultado.em; S.comercial.ultimoResultado = resultado; S.comercial.idsPlanilha = rv.idsPlanilha; S.comercial.planilhaAssinatura = assin; S.comercial.importacaoBloqueada = null;
    await col("config").doc("comercial").set({ ultimaImportacao: resultado.em, ultimoResultado: resultado, idsPlanilha: rv.idsPlanilha, planilhaAssinatura: assin, importacaoBloqueada: null }, { merge: true });
    if (forcar) registrar("Planilha do Trevor aplicada mesmo com o aviso da trava de segurança");
    let msgOrc = "";
    if (c.planilhaOrc) {
      try { const ro = await importarOrcamentos(); if (ro && (ro.novos || ro.alterados || !silencioso)) msgOrc = ` Orçamentos: ${ro.novos} ${ro.novos === 1 ? "novo" : "novos"}, ${ro.alterados} ${ro.alterados === 1 ? "atualizado" : "atualizados"}.`; }
      catch (e) { msgOrc = " " + (e && e.message ? e.message : "A planilha de orçamentos não pôde ser lida."); }
    }
    S.importando = false;
    await reload(silencioso && !rv.novas && !rv.alteradas && !msgOrc ? "" : `Planilha do Trevor lida: ${rv.novas} ${rv.novas === 1 ? "venda nova" : "vendas novas"}, ${rv.alteradas} ${rv.alteradas === 1 ? "atualizada" : "atualizadas"}.` + msgOrc);
  } catch (e) {
    S.importando = false;
    if (!silencioso) { toast(e && e.message && !e.code ? e.message : errMsg(e)); render(); }
  }
}
async function importarOrcamentos() {
  const txt = await baixarPlanilha(S.comercial.planilhaOrc, "orçamentos"); if (txt == null) return null;
  const ro = prepararOrcamentos(txt, { antigos: S.orc || {}, membros: S.members, hojeD: isoDia(new Date()) });
  await gravarLotes("orcamentos", ro.escritas);
  const extra = S.comercial.orcBase ? {} : { orcBase: isoDia(new Date()) };
  await col("config").doc("comercial").set({ ultimaImportacaoOrc: new Date().toISOString(), orcTemData: ro.temData, ...extra }, { merge: true });
  S.comercial.orcTemData = ro.temData; Object.assign(S.comercial, extra);
  return ro;
}
async function salvarComercial(campos, msg) {
  S.comercial = { ...S.comercial, ...campos };
  await col("config").doc("comercial").set(campos, { mergeFields: Object.keys(campos) });
  if (msg) toast(msg);
}
// Quando a cotação de um mês muda, recalcula as vendas em dólar daquele mês
async function aplicarCotacao(ym) {
  const cot = Number(S.comercial.cotacoes[ym]) || 0;
  const lote = S.db.batch(); let n = 0;
  for (const [id, v] of Object.entries(S.vendas)) {
    if (v.origem !== "crm" || !v.valorUSD || ymOf(v.fechamento) !== ym) continue;
    lote.set(col("vendas").doc(id), { cotacao: cot || null, semCotacao: !cot, valor: round2((v.valorBRL || 0) + (cot ? v.valorUSD * cot : 0)) }, { merge: true }); n++;
  }
  if (n) await lote.commit();
  await reload(n ? `Cotação aplicada em ${n} ${n === 1 ? "venda" : "vendas"} de ${ymLabel(ym)}.` : "Cotação salva.");
}
function alertasComerciais() {
  const vs = allVendas().filter(v => v.origem === "crm" && v.status !== "cancelada");
  const semCot = vs.filter(v => v.valorUSD && v.semCotacao);
  const comUsd = vs.filter(v => v.valorUSD);
  const semCadastro = [...new Set(vs.filter(v => !v.vendedor && !v.casa && v.vendedorNome && !oculto(v.vendedorNome)).map(v => v.vendedorNome))];
  const conferir = vs.filter(v => v.conferir);
  const ids = S.comercial.idsPlanilha; const naPlanilha = ids && ids.length ? new Set(ids) : null;
  // só avisa de vendas que importam para a conferência pelo portal (a partir de set/2026: fechadas ou com viagem desde então)
  const INICIO_CONFERENCIA = "2026-09-01";
  const fora = naPlanilha ? vs.filter(v => !naPlanilha.has(v.id) && ((v.fechamento || "") >= INICIO_CONFERENCIA || (v.retorno || v.embarque || "") >= INICIO_CONFERENCIA)) : [];
  return { semCot, comUsd, semCadastro, conferir, fora };
}
function alertasRobustez() {
  if (!souAdminReal()) return "";
  const c = S.comercial || {}; let h = "";
  const b = c.importacaoBloqueada;
  if (b && b.motivo) h += `<div class="banner bad-b"><span>🛑 <strong>Leitura do Trevor pausada</strong> (${dLabel(String(b.em || "").slice(0, 10)).slice(0, 5)}): ${esc(b.motivo)}. As vendas do portal não foram alteradas. Confira a planilha; se ela estiver certa, aplique.</span><span class="row">${c.planilha ? `<a class="btn sm" href="${esc(c.planilha)}" target="_blank" rel="noopener">Abrir planilha</a>` : ""}<button class="btn sm primary" data-act="forcar-trevor">Aplicar mesmo assim</button></span></div>`;
  const ok = c.roboOk || c.ultimaVerificacaoRobo, horas = ok ? (Date.now() - Date.parse(ok)) / 36e5 : null;
  const falha = c.roboFalha && c.roboFalha.em && (!ok || c.roboFalha.em > ok) ? c.roboFalha : null;
  if (falha) h += `<div class="banner bad-b"><span>🤖 <strong>O robô do GitHub deu erro</strong> em ${new Date(falha.em).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}: ${esc(falha.msg || "erro desconhecido")}. Fichas, vendas e Helena podem estar desatualizados.</span></div>`;
  else if (horas != null && horas > 3) h += `<div class="banner warn-b"><span>🤖 <strong>O robô não roda há ${horas >= 48 ? Math.floor(horas / 24) + " dias" : Math.floor(horas) + " horas"}</strong> (o normal é a cada 30 minutos). Confira no GitHub → Actions se ele está ativo; se precisar, clique em “Run workflow”.</span></div>`;
  if (!falha && c.trevorErro && c.trevorErro.em && Date.now() - Date.parse(c.trevorErro.em) < 24 * 36e5) h += `<div class="banner warn-b"><span>📄 <strong>O robô não conseguiu ler a planilha do Trevor</strong>: ${esc(c.trevorErro.msg || "")}. As vendas ficam como estavam até a próxima leitura certa.</span></div>`;
  else if (horas == null && c.planilha) h += `<div class="banner warn-b"><span>🤖 Ainda não há registro do robô rodando. Confira no GitHub → Actions.</span></div>`;
  return h;
}
function bannersComerciais(completo) {
  const a = alertasComerciais(); let h = "";
  if (a.semCot.length) h += `<div class="banner warn-b"><span>💵 ${a.semCot.length === 1 ? "<strong>1 venda</strong> em dólar está" : `<strong>${a.semCot.length} vendas</strong> em dólar estão`} sem cotação. Enquanto isso, contam só a parte em reais (na comissão e no bônus também).</span><button class="btn sm" data-act="abrir-dolar">Informar câmbio</button></div>`;
  else if (completo && a.comUsd.length) h += `<div class="banner"><span>💵 ${a.comUsd.length} ${a.comUsd.length === 1 ? "venda tem" : "vendas têm"} parte em dólar, convertida pelo câmbio de cada venda.</span><button class="btn sm" data-act="abrir-dolar">Ver câmbios</button></div>`;
  if (a.semCadastro.length) h += `<div class="banner warn-b"><span>Vendedor(a) da planilha sem cadastro no portal: ${a.semCadastro.map(n => `<strong>${esc(n)}</strong>`).join(", ")}. As vendas aparecem, mas sem comissão.</span><button class="btn sm" data-tab-go="acessos">Cadastrar ou ligar nome</button></div>`;
  if (a.fora.length) h += `<div class="banner warn-b"><span><strong>${a.fora.length}</strong> ${a.fora.length === 1 ? "venda está" : "vendas estão"} no portal mas não aparecem mais na planilha do Trevor (podem ter sido canceladas ou apagadas no CRM). Elas continuam contando até você conferir.</span><button class="btn sm" data-act="ver-fora">Ver quais</button></div>`;
  if (completo && a.conferir.length) h += `<div class="banner"><span>O Trevor marcou <strong>${a.conferir.length}</strong> ${a.conferir.length === 1 ? "venda" : "vendas"} para conferir no CRM (coluna “Conferir”).</span><button class="btn sm" data-act="ver-conferir">Ver quais</button></div>`;
  return h;
}

// ---------- importação dos passeios ----------
async function importarPasseios(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch (_) { toast("Esse arquivo não é o de passeios. Use o passeios-araya.json."); return; }
  const ds = Array.isArray(data.destinos) ? data.destinos : [], ps = Array.isArray(data.passeios) ? data.passeios : [];
  if (!ds.length || !ps.length) { toast("Esse arquivo não é o de passeios. Use o passeios-araya.json."); return; }
  toast("Importando " + ps.length + " passeios…");
  const writes = [...ds.map(d => ["destinos", d]), ...ps.map(p => ["passeios", p])];
  for (let i = 0; i < writes.length; i += 400) {
    const batch = S.db.batch();
    writes.slice(i, i + 400).forEach(([c, d]) => { const { id, ...rest } = d; batch.set(col(c).doc(String(id)), rest); });
    await batch.commit();
  }
  await reload(ds.length + " destinos e " + ps.length + " passeios importados");
}

// ---------- painel de uma pessoa ----------
function payloadFor(uid) {
  const cfg = S.members[uid] || {}; const hoje = ymNow(); const corte = addM(hoje, -24);
  const vendas = allVendas().filter(v => v.vendedor === uid && (ymOf(v.fechamento) >= corte || v.mesPagamento >= corte))
    .sort((a, b) => (b.fechamento || "").localeCompare(a.fechamento || ""));
  const atendimentos = {};
  for (let i = 0; i < 12; i++) { const m = addM(hoje, -i); const n = S.atend[m] && S.atend[m].porPessoa ? S.atend[m].porPessoa[uid] : null; if (n != null) atendimentos[m] = n; }
  const abas = { ...ABAS_PADRAO, ...(cfg.abas || {}) };
  let equipe = null;
  if (abas.equipe) {
    equipe = S.isAdmin ? computeEquipe().pessoas : S.equipeRes;
  }
  return { apelido: cfg.apelido || "", pct: cfg.pct ?? 0, abas, vendas, atendimentos, equipe, uid, supervisor: cfg.supervisor === true, bonus: cfg.bonus !== false, vendedora: cfg.vendedora !== false, clt: naEscala(uid) };
}

// ---------- início ----------
async function start(user) {
  S.session = user; S.ready = false;
  if (!user) { render(); return; }
  S.email = (user.email || "").toLowerCase();
  render();
  try {
    try { await col("config").doc("admin").get(); S.isAdmin = true; } catch (_) { S.isAdmin = false; }
    await loadAll();
    try { S.tab = localStorage.getItem("araya-tab-" + (S.isAdmin ? "o" : "m")); S.filtros.comSub = localStorage.getItem("araya-comsub") || "resumo"; S.filtros.agSub = localStorage.getItem("araya-agsub") || "disp"; } catch (_) {}
    S.ready = true; render();
    talvezSincronizarTrevor();
  } catch (e) { centerMsg("O portal não carregou", "Recarregue a página. Se continuar, avise a Letícia.", `<button class="btn" data-act="sair">Sair</button>`); }
}
function boot() {
  if (!window.firebase || Object.values(FIREBASE_CONFIG).some(v => String(v).startsWith("COLE_AQUI"))) {
    return centerMsg("Portal em configuração", "Falta ligar o portal ao banco de dados. Assim que a configuração for concluída, esta página passa a mostrar o login.");
  }
  firebase.initializeApp(FIREBASE_CONFIG);
  S.auth = firebase.auth(); S.db = firebase.firestore();
  S.auth.languageCode = "pt-BR";
  S.auth.onAuthStateChanged((user) => {
    if (!user) { S.session = null; S.isAdmin = false; S.ready = false; S.cm = { loaded: false, loading: false, posts: {}, fotos: {}, cfg: {}, sel: null, filtro: "todos", dest: "" }; render(); return; }
    if (S.session && S.session.uid === user.uid && S.ready) return;
    start(user);
  });
  window.addEventListener("focus", () => { if (S.ready && !S.isAdmin) reload(); });
}
boot();
})();
