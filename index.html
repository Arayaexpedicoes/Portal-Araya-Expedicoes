<style>
/* Layout: faixa escura da marca no topo (título + abas), conteúdo claro em coluna única de até 1120px; cada destino carrega a cor do logo dele */
:root{
  --bg:#f6f1e8; --surface:#fffdf8; --surface-2:#efe7da; --line:#e3d9c8;
  --fg:#38331f; --muted:#7a725d; --accent:#6f6a45; --accent-ink:#fffdf8; --accent-soft:#ebe6d3;
  --band:#ece2d0; --band-2:#e2d5be; --band-fg:#4a4530; --band-muted:#857c63; --logo:#7c7650;
  --ok:#3f7a4c; --ok-soft:#e1eedd; --warn:#94650a; --warn-soft:#f5e8cc; --bad:#a63d2f; --bad-soft:#f4dcd6; --info:#3c6a86; --info-soft:#dfe9ef;
  --d-cusco:#4e7f57; --d-patagonia:#3f6f93; --d-egito:#b08b5c; --d-japao:#b35a3b; --d-mendoza:#7c2f42; --d-atacama:#c0763a; --d-outro:#8a8470;
  --display:"Noto Serif", Georgia, "Times New Roman", serif;
  --body:"Montserrat", "Gotham", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:12px; --shadow:0 1px 2px rgb(74 69 48 / .06), 0 4px 14px rgb(74 69 48 / .06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17150f; --surface:#211e17; --surface-2:#2a261d; --line:#383226;
  --fg:#ede6d6; --muted:#a79f88; --accent:#c9c095; --accent-ink:#1d1b12; --accent-soft:#34301f;
  --band:#221f17; --band-2:#2e2a1f; --band-fg:#ede6d6; --band-muted:#a79f88; --logo:#cfc59c;
  --ok:#7cc48f; --ok-soft:#1d3323; --warn:#e2b04b; --warn-soft:#382d13; --bad:#ef8476; --bad-soft:#3d1d19; --info:#8bb8d6; --info-soft:#1d3240;
  --d-cusco:#7db88a; --d-patagonia:#7fadd2; --d-egito:#d9bb90; --d-japao:#e08a69; --d-mendoza:#d07b8f; --d-atacama:#e2a16a; --d-outro:#a9a28c;
  --shadow:0 1px 2px rgb(0 0 0 / .3);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#17150f; --surface:#211e17; --surface-2:#2a261d; --line:#383226;
  --fg:#ede6d6; --muted:#a79f88; --accent:#c9c095; --accent-ink:#1d1b12; --accent-soft:#34301f;
  --band:#221f17; --band-2:#2e2a1f; --band-fg:#ede6d6; --band-muted:#a79f88; --logo:#cfc59c;
  --ok:#7cc48f; --ok-soft:#1d3323; --warn:#e2b04b; --warn-soft:#382d13; --bad:#ef8476; --bad-soft:#3d1d19; --info:#8bb8d6; --info-soft:#1d3240;
  --d-cusco:#7db88a; --d-patagonia:#7fadd2; --d-egito:#d9bb90; --d-japao:#e08a69; --d-mendoza:#d07b8f; --d-atacama:#e2a16a; --d-outro:#a9a28c;
  --shadow:0 1px 2px rgb(0 0 0 / .3);
  color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0;letter-spacing:-.005em;line-height:1.25}
h1{font-size:1.3rem} h2{font-size:1.45rem} h3{font-size:1.08rem}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* faixa da marca */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--band);color:var(--band-fg);overflow:hidden}
header.top .ridge{position:absolute;right:0;bottom:0;width:min(560px,70%);height:100%;pointer-events:none;opacity:.35}
header.top{border-bottom:1px solid var(--line)}
.brand .logo{height:54px;width:auto;flex:none;color:var(--logo);display:block}
.brand .divider{width:1px;align-self:stretch;background:color-mix(in srgb, var(--band-fg) 18%, transparent);margin-block:6px}
.brand h1{font-size:1.25rem;color:var(--band-fg)}
@media (max-width:520px){.brand .logo{height:42px}.brand h1{font-size:1.05rem}}
.auth-logo{display:flex;justify-content:center;color:var(--logo);padding-bottom:4px}
.auth-logo svg{height:96px;width:auto}
header.top .wrap{position:relative}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 10px}
.brand .mark{display:flex;align-items:center;gap:12px;min-width:0}
.brand .mark svg{flex:none}
.brand .eyebrow{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--band-muted);font-weight:600}
.who{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--band-muted);min-width:0;background:color-mix(in srgb, var(--band-fg) 7%, transparent);border-radius:99px;padding:6px 14px}
.who:empty{display:none}
.who img{width:28px;height:28px;border-radius:50%}
.who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--band-fg)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;border-radius:99px;padding:7px 14px;color:var(--band-muted);font-weight:600;font-size:.86rem;white-space:nowrap;cursor:pointer;transition:background .15s,color .15s}
nav.tabs button[aria-current="true"]{color:var(--band);background:var(--band-fg)}
nav.tabs button:hover:not([aria-current="true"]){color:var(--band-fg);background:color-mix(in srgb, var(--band-fg) 8%, transparent)}
main{padding-block:26px 64px;display:grid;gap:22px}
.banner{background:var(--info-soft);color:var(--fg);border-radius:var(--r);padding:11px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.section-head > div{min-width:0}
.section-head p{margin:5px 0 0;color:var(--muted);max-width:65ch}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.tile{background:var(--surface);border-radius:var(--r);padding:16px 18px;display:grid;gap:4px;align-content:start;box-shadow:var(--shadow)}
.tile .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--display);font-size:1.85rem;font-weight:600;font-variant-numeric:tabular-nums lining-nums;line-height:1.15}
.tile .d{font-size:.82rem;color:var(--muted)}
.tile.feature{background:var(--band-2);color:var(--band-fg)}
.tile.feature .k,.tile.feature .d{color:var(--band-muted)}
.panel{background:var(--surface);border-radius:var(--r);padding:18px;display:grid;gap:14px;min-width:0;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.tablewrap{overflow-x:auto;min-width:0}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.9rem}
th{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover td{background:color-mix(in srgb, var(--surface-2) 45%, transparent)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
tfoot td{font-weight:700;border-top:1px solid var(--line)}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.dest{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted)}
.dest::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dc,var(--d-outro));flex:none}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:60px}
.bar > i{display:block;height:100%;border-radius:inherit;background:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.neutral{background:var(--surface-2);color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:99px;padding:7px 15px;font-weight:600;cursor:pointer;font-size:.86rem;white-space:nowrap;transition:background .15s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:4px 11px;font-size:.8rem}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-width:0;width:100%}
.section-head select,.section-head input[type=search]{background:var(--surface);box-shadow:var(--shadow);border-color:transparent}
input.cell{width:84px;text-align:right;padding:5px 8px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--muted);display:grid;gap:6px;justify-items:center}
.empty strong{color:var(--fg);font-family:var(--display);font-weight:600;font-size:1.02rem}
.member{display:grid;grid-template-columns:auto 1fr;gap:12px 14px;align-items:start;padding:16px 0;border-bottom:1px solid var(--line)}
.member:last-child{border-bottom:0}
.member img{width:42px;height:42px;border-radius:50%}
.member .body{display:grid;gap:10px;min-width:0}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.toggle{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:99px;padding:4px 12px 4px 7px;font-size:.84rem;cursor:pointer;user-select:none;background:var(--surface)}
.toggle input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.toggle:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.overlay{position:fixed;inset:0;background:rgb(8 18 14 / .5);z-index:20;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{background:var(--surface);border-radius:16px;max-width:640px;width:100%;max-height:100%;overflow:auto;padding:22px;display:grid;gap:16px;box-shadow:0 20px 50px rgb(0 0 0 / .25)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;font-size:.88rem;z-index:30;max-width:calc(100% - 32px)}
/* Passeios */
.tour{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:16px;align-items:start}
@media (max-width:760px){.tour{grid-template-columns:1fr}}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px 6px 10px;font-weight:600;font-size:.86rem;cursor:pointer}
.chip::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--dc,var(--d-outro))}
.chip[aria-pressed="true"]{background:var(--dc,var(--accent));border-color:var(--dc,var(--accent));color:var(--surface)}
.chip[aria-pressed="true"]::before{background:var(--surface)}
.tourlist{display:grid;gap:2px;max-height:70vh;overflow:auto;padding:4px}
.tourlist button{text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;line-height:1.35}
.tourlist button:hover{background:var(--surface-2)}
.tourlist button[aria-current="true"]{background:color-mix(in srgb, var(--dc,var(--accent)) 16%, transparent);font-weight:600}
.tourlist .grp{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;padding:10px 10px 2px}
.tourhead{display:grid;gap:4px}
.tourhead .dest{font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.7rem;color:var(--dc,var(--muted))}
.prose{min-width:0;overflow-wrap:anywhere}
.prose > :not(.galeria):not(.vgrade):not(.video){max-width:70ch}
.prose > .video{max-width:760px}
.prose h4{font-family:var(--display);font-weight:600;font-size:1.02rem;margin:20px 0 4px}
.prose h5{font-size:.9rem;margin:14px 0 2px}
.prose p{margin:0 0 8px}
.prose ul,.prose ol{margin:0 0 10px;padding-left:20px}
.prose li{margin:2px 0}
.prose li.sub{margin-left:18px;list-style:circle}
.prose > :first-child{margin-top:0}
.tourlist .tcat{display:block;font-size:.7rem;color:var(--muted);font-weight:500;letter-spacing:.02em}
.prose blockquote{margin:6px 0 10px;padding:9px 13px;border-left:3px solid var(--dc,var(--accent));background:color-mix(in srgb, var(--dc,var(--accent)) 8%, transparent);border-radius:0 8px 8px 0}
/* Fotos e vídeos */
.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin:6px 0 12px}
.galeria.uma{grid-template-columns:1fr;max-width:620px}
.galeria button{border:0;padding:0;background:var(--surface-2);border-radius:10px;overflow:hidden;cursor:zoom-in;display:grid;aspect-ratio:4/3;position:relative}
.galeria.uma button{aspect-ratio:auto;max-height:460px}
.galeria img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .25s}
.galeria img.ok{opacity:1}
.galeria figcaption{position:absolute;left:0;right:0;bottom:0;padding:16px 10px 7px;font-size:.76rem;color:#fff;text-align:left;background:linear-gradient(transparent,rgb(0 0 0 / .6))}
.video{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000;margin:6px 0 4px}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vgrade{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin:6px 0 12px;align-items:start}
.vgrade figure{margin:0;display:grid;gap:4px}
.vgrade video{width:100%;max-height:440px;border-radius:10px;background:#000;display:block}
.vgrade figcaption{font-size:.76rem;color:var(--muted)}
.vgrade .vfalha{aspect-ratio:9/12;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;text-align:center;padding:12px;font-size:.8rem;color:var(--muted)}
.arquivo{display:inline-flex;align-items:center;gap:8px;margin:4px 0 10px;padding:8px 12px;border-radius:10px;background:var(--surface-2);font-weight:600;font-size:.86rem;text-decoration:none;color:var(--fg)}
.arquivo:hover{background:color-mix(in srgb, var(--dc,var(--accent)) 12%, var(--surface-2))}
@media (max-width:520px){.galeria:not(.uma),.vgrade{grid-template-columns:repeat(2,minmax(0,1fr))}}
.video-leg{font-size:.8rem;color:var(--muted);margin:0 0 12px}
.lightbox{background:rgb(10 9 6 / .88);cursor:zoom-out}
.lightbox figure{margin:0;display:grid;gap:10px;justify-items:center;max-width:min(1400px,100%);max-height:100%}
.lightbox img{max-width:100%;max-height:calc(100vh - 110px);border-radius:8px;object-fit:contain;cursor:default}
.lightbox figcaption{color:#f3ede0;font-size:.88rem;text-align:center}
.lightbox .btn{background:rgb(255 255 255 / .12);color:#fff;border-color:transparent}
/* Tickets */
.acoes{display:flex;flex-wrap:wrap;gap:8px}
.ficha-head > .cat{justify-self:start}
.acoes .btn{text-decoration:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn.consultar{background:var(--dc,var(--accent));border-color:var(--dc,var(--accent));color:var(--surface);padding:9px 18px;font-size:.92rem}
.btn.consultar:hover{filter:brightness(1.08);background:var(--dc,var(--accent))}
.tk-obs{justify-self:start;font-size:.74rem;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--warn-soft);color:var(--warn)}
.tk-aviso{font-size:.8rem;color:var(--muted)}
/* Ficha do passeio */
.ficha{display:grid;gap:20px;min-width:0}
.ficha-head{display:grid;gap:10px}
.ficha-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.ficha-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cat{display:inline-flex;align-items:center;font-size:.68rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;padding:4px 11px;border-radius:99px;background:var(--dc,var(--accent));color:var(--surface)}
.etq{font-size:.74rem;font-weight:600;padding:3px 10px;border-radius:99px;background:color-mix(in srgb, var(--dc,var(--accent)) 12%, transparent);color:var(--fg)}
.ficha h3{font-size:clamp(1.4rem,3.2vw,1.8rem);line-height:1.2}
.ficha .ficha-sub{margin:0;color:var(--muted);font-family:var(--display);font-size:1.03rem;max-width:62ch}
.fatos{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:1px;margin:0;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fatos div{background:color-mix(in srgb, var(--dc,var(--accent)) 5%, var(--surface));padding:12px 14px;display:grid;gap:3px;align-content:start}
.fatos dt{font-size:.66rem;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);font-weight:600}
.fatos dd{margin:0;font-weight:600;font-size:.93rem;overflow-wrap:anywhere}
.fsec{display:grid;gap:8px;min-width:0}
.fh{font-family:var(--body);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dc,var(--muted));font-weight:700;margin:0;display:flex;align-items:center;gap:10px}
.fh::after{content:"";flex:1;height:1px;background:var(--line)}
.fcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.fcard{border-radius:var(--r);padding:15px 17px;display:grid;gap:8px;align-content:start;min-width:0}
.fcard .fh::after{display:none}
.fcard.inclui{background:var(--ok-soft)} .fcard.inclui .fh{color:var(--ok)}
.fcard.atencao{background:var(--warn-soft)} .fcard.atencao .fh{color:var(--warn)}
.fsec.guia{background:var(--surface-2);border-radius:var(--r);padding:15px 17px}
.guia-tag{justify-self:start;font-size:.7rem;font-weight:700;color:var(--bad);background:var(--bad-soft);padding:3px 10px;border-radius:99px}
.rev{font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin:0}
.notice{font-size:.82rem;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:8px 12px}
.center{min-height:52vh;display:grid;place-items:center;text-align:center}
.center .box{max-width:460px;display:grid;gap:10px;justify-items:center;background:var(--surface);border-radius:18px;padding:30px 26px;box-shadow:var(--shadow)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.auth{min-height:calc(100vh - 140px);display:grid;place-items:center;padding-block:24px}
.auth form{width:100%;max-width:400px;background:var(--surface);border-radius:18px;padding:28px 26px;box-shadow:var(--shadow);display:grid;gap:14px}
.auth h2{font-size:1.5rem}
.auth p{margin:0;color:var(--muted)}
.auth .btn.primary{padding:10px 16px;font-size:.95rem}
.auth .links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.85rem}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;font-size:inherit}
.linkbtn:hover{text-decoration:underline}
.msg{font-size:.86rem;border-radius:10px;padding:9px 12px}
.msg.err{background:var(--bad-soft);color:var(--bad)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
input[type=email],input[type=password]{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;width:100%}
.who .linkbtn{color:var(--band-fg);opacity:.8;font-size:.8rem;margin-left:4px}

html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
</style>

<script>
(() => {
"use strict";
// ================= CONFIGURAÇÃO =================

// =================================================

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const BRL = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
const money = (n) => BRL.format(Number(n) || 0);
const pctFmt = (n) => (Number(n) || 0).toLocaleString("pt-BR", { maximumFractionDigits: 2 }) + "%";
const ymOf = (d) => (d || "").slice(0, 7);
const ymNow = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); };
const addM = (ym, n) => { let [y, m] = ym.split("-").map(Number); m += n; y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1; return y + "-" + String(m).padStart(2, "0"); };
const MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
const MESES_L = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
const ymLabel = (ym) => { if (!ym) return "—"; const [y, m] = ym.split("-"); return MESES[+m - 1] + "/" + y; };
const ymLong = (ym) => { const [y, m] = ym.split("-"); return MESES_L[+m - 1] + " de " + y; };
const dLabel = (d) => d ? d.slice(8, 10) + "/" + d.slice(5, 7) + "/" + d.slice(0, 4) : "—";
const round2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
const DESTINOS = ["Cusco e Machu Picchu", "Patagônia", "Egito e Jordânia", "Japão", "Ushuaia", "Mendoza", "Atacama e Uyuni", "Outro"];
const DCOR = { "Cusco e Machu Picchu": "--d-cusco", "cusco-machu-picchu": "--d-cusco", "Patagônia": "--d-patagonia", "patagonia": "--d-patagonia", "Ushuaia": "--d-patagonia", "ushuaia": "--d-patagonia", "Egito e Jordânia": "--d-egito", "egito-jordania": "--d-egito", "Japão": "--d-japao", "japao": "--d-japao", "Mendoza": "--d-mendoza", "mendoza": "--d-mendoza", "Atacama e Uyuni": "--d-atacama" };
const dc = (k) => `--dc:var(${DCOR[k] || "--d-outro"})`;
const destTag = (n) => n ? `<span class="dest" style="${dc(n)}">${esc(n)}</span>` : "";
const ABAS = [["inicio", "Início"], ["comissoes", "Comissões"], ["vendas", "Minhas vendas"], ["passeios", "Passeios"], ["tickets", "Tickets"], ["equipe", "Resultados da equipe"]];
const ABAS_PADRAO = { inicio: true, comissoes: true, vendas: true, passeios: true, tickets: true, equipe: false };
const emailOk = (e) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);

// Regra de comissão: valor × percentual; paga no mês seguinte ao mês de embarque.
function enrich(v) {
  const pct = Number(v.pct) || 0, valor = Number(v.valor) || 0;
  return { ...v, valor, pct, comissao: round2(valor * pct / 100), mesPagamento: v.embarque ? addM(ymOf(v.embarque), 1) : "" };
}
function statusOf(v, hoje = ymNow()) {
  if (v.status === "cancelada") return "cancelada";
  if (v.pagaEm) return "paga";
  if (!v.mesPagamento) return "sem-data";
  return hoje >= v.mesPagamento ? "a-pagar" : "prevista";
}
const STATUS_PILL = { "paga": ["ok", "Paga"], "a-pagar": ["warn", "A pagar"], "prevista": ["info", "Prevista"], "cancelada": ["bad", "Cancelada"], "sem-data": ["neutral", "Sem data de embarque"] };
const pill = (st) => { const [c, t] = STATUS_PILL[st] || ["neutral", st]; return `<span class="pill ${c}">${t}</span>`; };

// ---------- estado ----------
const S = {
  auth: null, db: null, session: null, resumoAtual: "", email: "", isAdmin: false, ready: false, authMode: "entrar", authMsg: null, recovery: false,
  members: {}, vendas: {}, notas: {}, atend: {}, destinos: [], passeios: [], tickets: [], equipeRes: null,
  tab: null, previewUid: null,
  filtros: { vend: "", mes: "", busca: "", comMes: ymNow(), painelMes: ymNow(), destino: null, passeio: null, tourBusca: "", minhasMes: "", tkDest: null, tkItem: null, tkBusca: "" },
  pendingRender: false
};
let toastTimer;
function toast(msg) {
  const el = document.createElement("div"); el.className = "toast"; el.textContent = msg;
  document.querySelectorAll(".toast").forEach(t => t.remove());
  document.body.appendChild(el); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 2800);
}
function errMsg(e) {
  const m = (e && (e.message || e.code)) || "";
  if (e && e.code === "permission-denied") return "Você não tem permissão para fazer isso.";
  if (e && e.code === "unavailable") return "Sem conexão. Confira a internet e tente de novo.";
  if (/row-level security|permission denied/i.test(m)) return "Você não tem permissão para fazer isso.";
  if (/duplicate key/i.test(m)) return "Esse registro já existe.";
  if (/Failed to fetch|NetworkError/i.test(m)) return "Sem conexão. Confira a internet e tente de novo.";
  return "Não foi possível salvar agora. Tente de novo em instantes.";
}
const label = (uid) => (S.members[uid] && S.members[uid].apelido) || uid || "—";

// ---------- dados ----------
const col = (n) => S.db.collection(n);
const docsOf = (snap) => snap.docs.map(d => ({ id: d.id, ...d.data() }));
function setMembers(rows) { S.members = Object.fromEntries(rows.map(r => [r.id, { apelido: r.apelido || "", pct: r.pct == null ? null : Number(r.pct), abas: r.abas || {}, ativo: r.ativo !== false, uid: r.uid || null }])); }
function setVendas(rows) { S.vendas = Object.fromEntries(rows.map(r => [r.id, { cliente: r.cliente || "", vendedor: r.vendedor, destino: r.destino || "", valor: Number(r.valor) || 0, pct: Number(r.pct) || 0, fechamento: r.fechamento || "", embarque: r.embarque || "", status: r.status || "ativa", pagaEm: r.pagaEm || null, origem: r.origem || "manual" }])); }
function setAtend(rows) { S.atend = {}; for (const r of rows) (S.atend[r.mes] ||= { porPessoa: {} }).porPessoa[r.email] = r.n; }
function computeEquipe() {
  const hoje = ymNow(); const meses = [hoje, addM(hoje, -1), addM(hoje, -2)];
  const ativas = allVendas().filter(v => v.status !== "cancelada");
  return { meses, pessoas: activeMembers().map(u => ({ uid: u, apelido: S.members[u].apelido || "", meses: Object.fromEntries(meses.map(m => { const vs = ativas.filter(v => v.vendedor === u && ymOf(v.fechamento) === m); return [m, { q: vs.length, v: round2(vs.reduce((s, v) => s + v.valor, 0)) }]; })) })) };
}
async function syncResumo() {
  const r = computeEquipe(); const j = JSON.stringify(r);
  if (j === S.resumoAtual) return;
  await col("resumo").doc("equipe").set({ ...r, geradoEm: new Date().toISOString() });
  S.resumoAtual = j;
}
async function loadAll() {
  const me = S.email;
  if (S.isAdmin) {
    const [eq, vs, ns, at, ds, ps, rs] = await Promise.all([col("equipe").get(), col("vendas").get(), col("vendasNotas").get(), col("atendimentos").get(), col("destinos").get(), col("passeios").get(), col("resumo").doc("equipe").get()]);
    setMembers(docsOf(eq)); setVendas(docsOf(vs)); setAtend(docsOf(at));
    S.notas = Object.fromEntries(docsOf(ns).map(r => [r.id, r.obs || ""]));
    S.destinos = docsOf(ds); S.passeios = docsOf(ps);
    await carregarTickets();
    if (rs.exists) { const d = rs.data(); S.resumoAtual = JSON.stringify({ meses: d.meses, pessoas: d.pessoas }); }
    try { await syncResumo(); } catch (_) { /* tenta de novo no próximo carregamento */ }
    return;
  }
  let meSnap = null;
  try { meSnap = await col("equipe").doc(me).get(); } catch (e) { if (e && e.code === "permission-denied") { S.members = {}; return; } throw e; }
  setMembers(meSnap.exists ? [{ id: me, ...meSnap.data() }] : []);
  if (!meSnap.exists || meSnap.data().ativo === false) return;
  const [vs, at, ds, ps] = await Promise.all([col("vendas").where("vendedor", "==", me).get(), col("atendimentos").where("email", "==", me).get(), col("destinos").get(), col("passeios").get()]);
  setVendas(docsOf(vs)); setAtend(docsOf(at)); S.destinos = docsOf(ds); S.passeios = docsOf(ps);
  await carregarTickets();
  S.equipeRes = null;
  if ((meSnap.data().abas || {}).equipe) {
    try { const r = await col("resumo").doc("equipe").get(); if (r.exists) S.equipeRes = r.data().pessoas || []; } catch (_) {}
  }
}
async function carregarTickets() { try { S.tickets = docsOf(await col("tickets").get()); } catch (_) { S.tickets = []; } }
async function reload(msg) {
  try { await loadAll(); } catch (e) { toast(errMsg(e)); }
  if (msg) toast(msg);
  scheduleRender();
}

// ---------- render ----------
function scheduleRender() {
  const a = document.activeElement;
  if (a && $("#main").contains(a) && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) && a.type !== "checkbox" && a.type !== "search" && a.type !== "file") { S.pendingRender = true; return; }
  render();
}
document.addEventListener("focusout", () => { if (S.pendingRender) { S.pendingRender = false; setTimeout(render, 0); } });
function setMain(html) { $("#main").innerHTML = html; if (html.includes("data-midia")) carregarFotos(); }
function centerMsg(t, p, extra = "") { $("#tabs").innerHTML = ""; setMain(`<div class="center"><div class="box"><h2>${esc(t)}</h2><p class="muted">${p}</p>${extra}</div></div>`); }

function ownerTabs() { return [["painel", "Visão geral"], ["vendas", "Vendas"], ["comissoes", "Comissões"], ["atendimentos", "Atendimentos"], ["acessos", "Equipe e acessos"], ["passeios", "Passeios"], ["tickets", "Tickets"]]; }
function memberTabs(data) { const ab = { ...ABAS_PADRAO, ...((data && data.abas) || {}) }; return ABAS.filter(([k]) => ab[k]); }

function render() {
  renderWho();
  if (!S.auth) return;
  if (!S.session) return renderAuth(S.authMode);
  if (!S.ready) return centerMsg("Carregando o portal…", "Conferindo seu acesso.");
  const viewingAs = S.isAdmin && S.previewUid ? S.previewUid : null;
  if (S.isAdmin && !viewingAs) return renderOwner();

const AUTH_ERR = (e) => {

function mdInline(s) {
  s = esc(s);
  s = s.replace(/\[([^\]]+)\]\(((?:https?:\/\/|mailto:|tel:)[^)\s]+)\)/g, (m, t, u) => `<a href="${u}"${/^https?:/.test(u) ? ' target="_blank" rel="noopener"' : ""}>${t}</a>`);
  s = s.replace(/\*\*([^*]+?)\*\*/g, "<strong>$1</strong>").replace(/\*\*/g, "");
  return autoLinks(s);
}
// Transforma endereços, e-mails e telefones soltos no texto em links (telefone abre o WhatsApp)
function foraDeLinks(html, fn) { return html.split(/(<a\b[^>]*>[\s\S]*?<\/a>)/g).map((p, i) => i % 2 ? p : fn(p)).join(""); }
function autoLinks(html) {
  html = foraDeLinks(html, (t) => t.replace(/\bhttps?:\/\/[^\s<]*[^\s<.,;:)]/g, (u) => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`));
  html = foraDeLinks(html, (t) => t.replace(/[\w.+-]+@[\w-]+(?:\.[\w-]+)+/g, (e) => `<a href="mailto:${e}">${e}</a>`));
  html = foraDeLinks(html, (t) => t.replace(/\+\s?\d[\d\s()\-\u202a\u202c]{8,}\d/g, (tel) => { const n = tel.replace(/\D/g, ""); return n.length >= 10 && n.length <= 15 ? `<a href="https://wa.me/${n}" target="_blank" rel="noopener" title="Abrir no WhatsApp">${tel}</a>` : tel; }));
  return html;
}
const VIDEO_URL = { youtube: (id) => `https://www.youtube-nocookie.com/embed/${id}?rel=0`, drive: (id) => `https://drive.google.com/file/d/${id}/preview`, vimeo: (id) => `https://player.vimeo.com/video/${id}` };
function videoNotionHtml(a) {
  if (!a || !a.url) return "";
  const vencido = a.expira && Date.parse(a.expira) < Date.now();
  const leg = a.legenda ? `<figcaption>${esc(a.legenda)}</figcaption>` : "";
  if (vencido) return `<figure><div class="vfalha">Vídeo sendo atualizado.<br>Recarregue a página em alguns minutos.</div>${leg}</figure>`;
  return `<figure><video controls playsinline preload="metadata" src="${esc(a.url)}#t=0.1" data-vnome="${esc(a.nome || "")}"></video>${leg}</figure>`;
}
function md(src, fotos = {}, arqs = {}) {
  let out = "", list = null, gal = [], vids = [];
  const fechaVid = () => { if (vids.length) { out += `<div class="vgrade">${vids.map(id => videoNotionHtml(arqs[id])).join("")}</div>`; vids = []; } };
  const fechaGal = () => { if (gal.length) { out += `<div class="galeria${gal.length === 1 ? " uma" : ""}">${gal.map(id => { const f = fotos[id] || {}; return `<button type="button" data-foto="${esc(id)}" aria-label="Ampliar foto${f.legenda ? ": " + esc(f.legenda) : ""}"><img data-midia="${esc(id)}" alt="${esc(f.legenda || "")}">${f.legenda ? `<figcaption>${esc(f.legenda)}</figcaption>` : ""}</button>`; }).join("")}</div>`; gal = []; } };
  const close = () => { if (list) { out += `</${list}>`; list = null; } };
  for (const raw of String(src || "").split("\n")) {
    const t = raw.trim(); let m;
    if ((m = t.match(/^\[\[foto:([A-Za-z0-9_-]+)\]\]$/))) { close(); fechaVid(); gal.push(m[1]); continue; }
    fechaGal();
    if ((m = t.match(/^\[\[nvideo:([A-Za-z0-9_-]+)\]\]$/))) { close(); if (arqs[m[1]]) vids.push(m[1]); continue; }
    fechaVid();
    if ((m = t.match(/^\[\[arquivo:([A-Za-z0-9_-]+)\]\]$/))) { close(); const a = arqs[m[1]]; if (a && a.url) out += `<a class="arquivo" href="${esc(a.url)}" target="_blank" rel="noopener">📄 ${esc(a.legenda || a.nome || "Abrir arquivo")}</a>`; continue; }
    if ((m = t.match(/^\[\[video:(youtube|drive|vimeo):([A-Za-z0-9_-]+)(?:\|([^\]]*))?\]\]$/))) {
      close(); out += `<div class="video"><iframe src="${VIDEO_URL[m[1]](m[2])}" title="${esc(m[3] || "Vídeo")}" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>${m[3] ? `<p class="video-leg">${esc(m[3])}</p>` : ""}`; continue;
    }
    if (!t) { close(); continue; }
    if ((m = t.match(/^(#{2,6})\s+(.*)$/))) { close(); const lv = m[1].length <= 3 ? "h4" : "h5"; out += `<${lv}>${mdInline(m[2])}</${lv}>`; continue; }
    if ((m = t.match(/^>\s?(.*)$/))) { close(); out += `<blockquote>${mdInline(m[1])}</blockquote>`; continue; }
    if ((m = t.match(/^[-•]\s+(.*)$/))) { if (list !== "ul") { close(); out += "<ul>"; list = "ul"; } out += `<li${/^\s{2,}/.test(raw) ? ' class="sub"' : ""}>${mdInline(m[1])}</li>`; continue; }
    if ((m = t.match(/^(\d+)[.)]\s+(.*)$/))) { if (list !== "ol") { close(); out += "<ol>"; list = "ol"; } out += `<li>${mdInline(m[2])}</li>`; continue; }
    close(); out += `<p>${mdInline(t)}</p>`;
  }
  close(); fechaGal(); fechaVid(); return out;
}
// Fotos ficam no banco do portal; carregam só quando a ficha é aberta.

  return `<article class="ficha">

    ${S.isAdmin && !S.previewUid && f.pendentes ? `<div class="notice">Só você vê este aviso: na página Destinos antiga este trecho tinha ${f.pendentes} ${f.pendentes === 1 ? "foto ou vídeo" : "fotos e vídeos"}. Copie para esta ficha no Notion e depois apague o aviso 📷 da ficha.</div>` : ""}

// ---------- tickets (consultar disponibilidade e reservar) ----------
function acoesDoTexto(txt) {
  const vistos = new Set(), sites = [], emails = [], zaps = [];
  const addSite = (u) => { u = u.replace(/[.,;:)]+$/, ""); if (!vistos.has(u)) { vistos.add(u); sites.push(u); } };
  String(txt || "").replace(/\[[^\]]*\]\((https?:\/\/[^)\s]+)\)/g, (m, u) => addSite(u)).replace(/(^|[^(])\b(https?:\/\/[^\s)\]]+)/g, (m, a, u) => addSite(u));
  for (const m of String(txt || "").matchAll(/[\w.+-]+@[\w-]+(?:\.[\w-]+)+/g)) if (!vistos.has(m[0]) && !/araya/i.test(m[0])) { vistos.add(m[0]); emails.push(m[0]); }
  for (const m of String(txt || "").matchAll(/\+\s?\d[\d\s()\-\u202a\u202c]{8,}\d/g)) { const n = m[0].replace(/\D/g, ""); if (n.length >= 10 && n.length <= 15 && !vistos.has(n)) { vistos.add(n); zaps.push([n, "+" + m[0].replace(/[^\d\s]/g, "").trim()]); } }
  return { sites: sites.filter(u => !/wa\.me|notion\.(so|com)/.test(u)), emails, zaps };
}
const hostDe = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (_) { return u; } };
function ticketsView() {
  const itens = S.tickets || [];
  const dests = [...new Map(itens.map(t => [t.destino, { id: t.destino, nome: t.destinoNome || t.destino, ordem: t.destinoOrdem || 99 }])).values()].sort((a, b) => a.ordem - b.ordem);
  const head = `<div class="section-head"><div><h2>Tickets</h2><p>Escolha o lugar para consultar disponibilidade e ver como reservar.</p></div>`;
  if (!dests.length) return head + `</div><div class="empty"><strong>Os tickets ainda não chegaram</strong><span>${S.isAdmin ? "Eles vêm da página Tickets do Notion. Adicione a conexão “Portal Araya” nessa página e rode o robô." : "As informações de reserva aparecem aqui assim que forem publicadas."}</span></div>`;
  if (!S.filtros.tkDest || !dests.find(d => d.id === S.filtros.tkDest)) S.filtros.tkDest = dests[0].id;
  const dest = dests.find(d => d.id === S.filtros.tkDest);
  const q = S.filtros.tkBusca.trim().toLowerCase();
  const intro = itens.find(t => t.tipo === "intro" && t.destino === dest.id && (t.texto || (t.fotos || []).length || (t.arquivos || []).length));
  let lista = itens.filter(t => t.tipo === "item" && t.destino === dest.id).sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
  if (q) lista = lista.filter(t => [t.nome, t.obs, t.texto].join(" ").toLowerCase().includes(q));
  let sel = S.filtros.tkItem && (S.filtros.tkItem === "__intro" ? intro : lista.find(t => t.id === S.filtros.tkItem)) ? S.filtros.tkItem : (lista[0] ? lista[0].id : intro ? "__intro" : null);
  const item = sel === "__intro" ? intro : lista.find(t => t.id === sel);
  let painel = `<div class="empty"><strong>Nada encontrado</strong><span>Tente outra palavra na busca.</span></div>`;
  if (item) {
    const fmap = Object.fromEntries((item.fotos || []).map(x => [x.id, x])), amap = Object.fromEntries((item.arquivos || []).map(x => [x.id, x]));
    const ac = acoesDoTexto(item.texto);
    const botoes = [
      ...ac.sites.map((u, i) => `<a class="btn ${i === 0 ? "consultar" : "sm"}" href="${esc(u)}" target="_blank" rel="noopener">${i === 0 ? "Consultar disponibilidade" + (ac.sites.length > 1 ? " · " + esc(hostDe(u)) : "") + " ↗" : "↗ " + esc(hostDe(u))}</a>`),
      ...ac.emails.map(e => `<a class="btn sm" href="mailto:${esc(e)}">✉ ${esc(e)}</a>`),
      ...ac.zaps.map(([n, t]) => `<a class="btn sm" href="https://wa.me/${n}" target="_blank" rel="noopener">WhatsApp ${esc(t)}</a>`)
    ];
    painel = `<article class="ficha">
      <header class="ficha-head"><span class="cat">${esc(dest.nome)}</span><h3>${esc(item.tipo === "intro" ? "Como funciona em " + dest.nome : item.nome)}</h3>${item.obs ? `<span class="tk-obs">${esc(item.obs)}</span>` : ""}</header>
      ${botoes.length ? `<div class="acoes">${botoes.join("")}</div>` : item.tipo === "item" ? `<p class="tk-aviso">Este lugar não tem link de reserva: a reserva é feita pelos contatos abaixo.</p>` : ""}
      <div class="prose">${md(item.texto, fmap, amap)}</div>
      ${item.tipo === "item" ? `<p class="rev">Logins e senhas ficam só na página Tickets do Notion.</p>` : ""}
    </article>`;
  }
  return head + `<div class="field" style="min-width:min(260px,100%)"><label for="f-tk">Buscar neste destino</label><input type="search" id="f-tk" placeholder="Ex.: trem, almoço, ingresso" value="${esc(S.filtros.tkBusca)}"></div></div>
  <div class="chips" role="group" aria-label="Destinos">${dests.map(d => `<button type="button" class="chip" style="${dc(d.id)}" data-tkdest="${esc(d.id)}" aria-pressed="${d.id === dest.id}">${esc(d.nome)}</button>`).join("")}</div>
  <div class="tour" style="${dc(dest.id)}">
    <section class="panel" style="padding:8px"><div class="tourlist">
      ${intro ? `<button type="button" data-tkid="__intro" aria-current="${sel === "__intro"}">Como funciona em ${esc(dest.nome)}</button>` : ""}
      <div class="grp">Lugares (${lista.length})</div>
      ${lista.map(t => `<button type="button" data-tkid="${esc(t.id)}" aria-current="${t.id === sel}">${esc(t.nome)}${t.obs ? `<span class="tcat">${esc(t.obs)}</span>` : ""}</button>`).join("") || `<div class="muted small" style="padding:8px 10px">Nada encontrado para “${esc(q)}”.</div>`}
    </div></section>
    <section class="panel">${painel}</section>
  </div>`;
}

const allVendas = () => Object.entries(S.vendas).map(([id, v]) => enrich({ id, ...v, obs: S.notas[id] || "" }));

function monthOptions(sel, back = 12, fwd = 2, withAll = false) {
  const hoje = ymNow();
  const set = new Set(allVendas().flatMap(v => [ymOf(v.fechamento), v.mesPagamento]).filter(Boolean));
  for (let i = -back; i <= fwd; i++) set.add(addM(hoje, i));
  return (withAll ? `<option value="">Todos</option>` : "") + [...set].sort().reverse().map(m => `<option value="${m}" ${m === sel ? "selected" : ""}>${ymLabel(m)}</option>`).join("");
}

function ownerPainel() {

  <div class="tiles">
    <div class="tile"><span class="k">Vendas fechadas</span><span class="v">${tot.q}</span><span class="d">${money(tot.val)}</span></div>
    <div class="tile"><span class="k">Atendimentos</span><span class="v">${tot.at || "—"}</span><span class="d">${tot.at ? "Conversão de " + (tot.q / tot.at * 100).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + "%" : "Ainda não lançados"}</span></div>

function openVenda(id) {
  const v = id ? { id, ...S.vendas[id], obs: S.notas[id] || "" } : null;
  const mem = activeMembers();
  const vend = v ? v.vendedor : (mem[0] || "");
  const pct = v ? v.pct : ((S.members[vend] && S.members[vend].pct) ?? "");
  const vendOpts = [...new Set([...mem, ...(v ? [v.vendedor] : [])])];
  $("#layer").innerHTML = `<div class="overlay" data-close><form class="dialog" id="venda-form" novalidate>
    <div class="section-head"><h2>${v ? "Editar venda" : "Nova venda"}</h2><button type="button" class="btn sm ghost" data-close-btn>Fechar</button></div>
    <div class="formgrid">
      <div class="field" style="grid-column:1/-1"><label for="v-cliente">Cliente</label><input type="text" id="v-cliente" value="${esc(v ? v.cliente : "")}" placeholder="Nome do cliente ou do grupo"></div>
      <div class="field"><label for="v-vend">Vendedor</label><select id="v-vend">${vendOpts.map(u => `<option value="${esc(u)}" ${u === vend ? "selected" : ""}>${esc(label(u))}</option>`).join("")}</select></div>
      <div class="field"><label for="v-dest">Destino</label><select id="v-dest">${DESTINOS.map(d => `<option ${v && v.destino === d ? "selected" : ""}>${d}</option>`).join("")}</select></div>
      <div class="field"><label for="v-valor">Valor da venda (R$)</label><input type="number" min="0" step="0.01" id="v-valor" value="${v ? v.valor : ""}" placeholder="Ex.: 12500"></div>
      <div class="field"><label for="v-pct">Comissão (%)</label><input type="number" min="0" max="100" step="0.1" id="v-pct" value="${pct ?? ""}" placeholder="Percentual"></div>
      <div class="field"><label for="v-fech">Data de fechamento</label><input type="date" id="v-fech" value="${esc(v ? v.fechamento : new Date().toISOString().slice(0, 10))}"></div>
      <div class="field"><label for="v-emb">Data de embarque</label><input type="date" id="v-emb" value="${esc(v ? v.embarque : "")}"></div>
      <div class="field" style="grid-column:1/-1"><label for="v-obs">Observação (só a administração vê)</label><input type="text" id="v-obs" value="${esc(v ? v.obs : "")}" placeholder="Opcional"></div>
    </div>
    <div class="notice" id="v-preview"></div>
    ${v ? `<label class="toggle" style="justify-self:start"><input type="checkbox" id="v-cancel" ${v.status === "cancelada" ? "checked" : ""}>Venda cancelada (não gera comissão)</label>` : ""}
    <p class="small" id="v-erro" style="color:var(--bad);margin:0" hidden></p>
    <div class="row" style="justify-content:space-between">
      <div>${v ? `<button type="button" class="btn danger" data-act="excluir-venda" data-id="${esc(v.id)}">Excluir venda</button>` : ""}</div>
      <div class="row"><button type="button" class="btn" data-close-btn>Cancelar</button><button type="submit" class="btn primary">${v ? "Salvar alterações" : "Lançar venda"}</button></div>
    </div>
  </form></div>`;
  const form = $("#venda-form");
  const upd = () => {
    const valor = Number($("#v-valor").value) || 0, p = Number($("#v-pct").value) || 0, emb = $("#v-emb").value;
    $("#v-preview").textContent = emb ? `Comissão de ${money(valor * p / 100)}, paga em ${ymLong(addM(ymOf(emb), 1))}.` : "Informe a data de embarque para calcular quando a comissão será paga.";
  };
  form.addEventListener("input", upd);
  $("#v-vend").addEventListener("change", () => { if (!v) { const m = S.members[$("#v-vend").value]; $("#v-pct").value = m && m.pct != null ? m.pct : ""; upd(); } });
  upd();
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const erro = $("#v-erro");
    const row = {
      cliente: $("#v-cliente").value.trim(), vendedor: $("#v-vend").value, destino: $("#v-dest").value,
      valor: round2($("#v-valor").value), pct: Number($("#v-pct").value) || 0,
      fechamento: $("#v-fech").value, embarque: $("#v-emb").value,
      status: v && $("#v-cancel") && $("#v-cancel").checked ? "cancelada" : "ativa",
      pagaEm: v ? (v.pagaEm || null) : null, origem: v ? (v.origem || "manual") : "manual",
      atualizadoEm: new Date().toISOString()
    };
    const obs = $("#v-obs").value.trim();
    const faltam = [];
    if (!row.cliente) faltam.push("cliente"); if (!row.vendedor) faltam.push("vendedor"); if (!(row.valor > 0)) faltam.push("valor");
    if (!row.fechamento) faltam.push("data de fechamento"); if (!row.embarque) faltam.push("data de embarque");
    if (faltam.length) { erro.hidden = false; erro.textContent = "Preencha: " + faltam.join(", ") + "."; return; }
    if (row.embarque < row.fechamento) { erro.hidden = false; erro.textContent = "A data de embarque está antes da data de fechamento. Confira as datas."; return; }
    const btn = form.querySelector("[type=submit]"); btn.disabled = true;
    try {
      const ref = v ? col("vendas").doc(v.id) : col("vendas").doc();
      await ref.set(row);
      if (obs) await col("vendasNotas").doc(ref.id).set({ obs });
      else if (v && v.obs) await col("vendasNotas").doc(ref.id).delete();
      closeLayer(); await reload(v ? "Venda atualizada" : "Venda lançada");
    } catch (err) { btn.disabled = false; erro.hidden = false; erro.textContent = errMsg(err); }
  });
}

$("#main").addEventListener("click", async (e) => {

  const tkd = e.target.closest("[data-tkdest]"); if (tkd) { S.filtros.tkDest = tkd.dataset.tkdest; S.filtros.tkItem = null; render(); return; }
  const tki = e.target.closest("[data-tkid]"); if (tki) { S.filtros.tkItem = tki.dataset.tkid; render(); if (innerWidth < 760) { const p = document.querySelectorAll(".tour .panel")[1]; if (p) p.scrollIntoView({ behavior: "smooth", block: "start" }); } return; }

  const act = b.dataset.act, uid = b.dataset.uid, id = b.dataset.id;
  try {
    if (act === "nova-venda") openVenda(null);
    else if (act === "editar-venda") openVenda(id);
    else if (act === "pagar") await run(col("vendas").doc(id).update({ pagaEm: ymNow() }), "Comissão marcada como paga");
    else if (act === "despagar") await run(col("vendas").doc(id).update({ pagaEm: null }), "Pagamento desfeito");
    else if (act === "pagar-todas") {
      b.disabled = true;
      const lista = allVendas().filter(v => v.vendedor === uid && v.mesPagamento === S.filtros.comMes && v.status !== "cancelada" && !v.pagaEm).map(v => v.id);
      const batch = S.db.batch(); lista.forEach(i => batch.update(col("vendas").doc(i), { pagaEm: ymNow() }));
      await run(batch.commit(), "Comissões marcadas como pagas");
    }
    else if (act === "suspender") {
      if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = "Confirmar suspensão"; return; }
      await run(col("equipe").doc(uid).update({ ativo: false }), "Acesso suspenso");
    }
    else if (act === "reativar") await run(col("equipe").doc(uid).update({ ativo: true }), "Acesso reativado");
    else if (act === "reenviar") { b.disabled = true; await sendLink(uid); toast("Link de senha enviado para " + uid); b.disabled = false; }
    else if (act === "ver-como") { S.previewUid = uid; S.tab = "inicio"; render(); window.scrollTo({ top: 0 }); }
    else if (act === "sair-preview") { S.previewUid = null; S.tab = "acessos"; render(); }
  } catch (err) { toast(errMsg(err)); b.disabled = false; }
});
$("#main").addEventListener("submit", async (e) => {
  if (e.target.id !== "add-form") return;
  e.preventDefault();
  const email = $("#n-email").value.trim().toLowerCase(), apelido = $("#n-apelido").value.trim(), p = $("#n-pct").value;
  const erro = $("#add-erro");
  if (!emailOk(email)) { erro.textContent = "Digite um e-mail válido."; erro.style.color = "var(--bad)"; return; }
  if (S.members[email]) { erro.textContent = "Esse e-mail já está cadastrado."; erro.style.color = "var(--bad)"; return; }
  const btn = e.target.querySelector("[type=submit]"); btn.disabled = true;
  erro.style.color = "var(--muted)"; erro.textContent = "Criando o login…";
  try {
    const sec = firebase.apps.find(a => a.name === "cadastro") || firebase.initializeApp(FIREBASE_CONFIG, "cadastro");
    const bytes = crypto.getRandomValues(new Uint8Array(24));
    const tmp = Array.from(bytes, x => x.toString(16).padStart(2, "0")).join("") + "Aa1!";
    const cred = await sec.auth().createUserWithEmailAndPassword(email, tmp);
    const uid = cred.user.uid; await sec.auth().signOut();
    await col("equipe").doc(email).set({ apelido, pct: p === "" ? null : Math.max(0, Math.min(100, Number(p))), abas: { ...ABAS_PADRAO }, ativo: true, uid, criadoEm: new Date().toISOString() });
    let aviso = "Pessoa cadastrada. Ela recebeu um e-mail para criar a senha.";
    try { await sendLink(email); } catch (_) { aviso = "Pessoa cadastrada, mas o e-mail de senha não saiu. Use “Reenviar link de senha”."; }
    await reload(aviso);
  } catch (err) {
    btn.disabled = false; erro.style.color = "var(--bad)";
    erro.textContent = err && err.code === "auth/email-already-in-use"
      ? "Esse e-mail já tem um login no Firebase. Se for de um cadastro antigo, apague esse usuário em Authentication → Users no Firebase e cadastre de novo."
      : (err && err.code && err.code.startsWith("auth/") ? AUTH_ERR(err) : errMsg(err));
  }
});
$("#main").addEventListener("change", async (e) => {

  try {

// ---------- importação dos passeios ----------
async function importarPasseios(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch (_) { toast("Esse arquivo não é o de passeios. Use o passeios-araya.json."); return; }
  const ds = Array.isArray(data.destinos) ? data.destinos : [], ps = Array.isArray(data.passeios) ? data.passeios : [];
  if (!ds.length || !ps.length) { toast("Esse arquivo não é o de passeios. Use o passeios-araya.json."); return; }
  toast("Importando " + ps.length + " passeios…");
  const writes = [...ds.map(d => ["destinos", d]), ...ps.map(p => ["passeios", p])];
  for (let i = 0; i < writes.length; i += 400) {
    const batch = S.db.batch();
    writes.slice(i, i + 400).forEach(([c, d]) => { const { id, ...rest } = d; batch.set(col(c).doc(String(id)), rest); });
    await batch.commit();
  }
  await reload(ds.length + " destinos e " + ps.length + " passeios importados");
}

// ---------- painel de uma pessoa ----------
function payloadFor(uid) {
  const cfg = S.members[uid] || {}; const hoje = ymNow(); const corte = addM(hoje, -24);
  const vendas = allVendas().filter(v => v.vendedor === uid && (ymOf(v.fechamento) >= corte || v.mesPagamento >= corte))
    .sort((a, b) => (b.fechamento || "").localeCompare(a.fechamento || ""));
  const atendimentos = {};
  for (let i = 0; i < 12; i++) { const m = addM(hoje, -i); const n = S.atend[m] && S.atend[m].porPessoa ? S.atend[m].porPessoa[uid] : null; if (n != null) atendimentos[m] = n; }
  const abas = { ...ABAS_PADRAO, ...(cfg.abas || {}) };
  let equipe = null;
  if (abas.equipe) {
    equipe = S.isAdmin ? computeEquipe().pessoas : S.equipeRes;
  }
  return { apelido: cfg.apelido || "", pct: cfg.pct ?? 0, abas, vendas, atendimentos, equipe };
}

async function start(user) {
  S.session = user; S.ready = false;
  if (!user) { render(); return; }
  S.email = (user.email || "").toLowerCase();
  render();
  try {
    try { await col("config").doc("admin").get(); S.isAdmin = true; } catch (_) { S.isAdmin = false; }
    await loadAll();
    try { S.tab = localStorage.getItem("araya-tab-" + (S.isAdmin ? "o" : "m")); } catch (_) {}
    S.ready = true; render();
  } catch (e) { centerMsg("O portal não carregou", "Recarregue a página. Se continuar, avise a Letícia.", `<button class="btn" data-act="sair">Sair</button>`); }
}
function boot() {
  if (!window.firebase || Object.values(FIREBASE_CONFIG).some(v => String(v).startsWith("COLE_AQUI"))) {
    return centerMsg("Portal em configuração", "Falta ligar o portal ao banco de dados. Assim que a configuração for concluída, esta página passa a mostrar o login.");
  }
  firebase.initializeApp(FIREBASE_CONFIG);
  S.auth = firebase.auth(); S.db = firebase.firestore();
  S.auth.languageCode = "pt-BR";
  S.auth.onAuthStateChanged((user) => {
    if (!user) { S.session = null; S.isAdmin = false; S.ready = false; render(); return; }
    if (S.session && S.session.uid === user.uid && S.ready) return;
    start(user);
  });
  window.addEventListener("focus", () => { if (S.ready && !S.isAdmin) reload(); });
}
boot();
})();

</script>
</body>
