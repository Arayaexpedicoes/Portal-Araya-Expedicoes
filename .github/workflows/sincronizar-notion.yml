                revisadoPor: (prop(P["Revisado por"]) || []).join(", "),
                revisadoEm: prop(P["Revisado em"]) || "",
                editadoEm: pg.last_edited_time || "",
                secoes: conteudo.secoes,
                pendentes: conteudo.pendentes,
                fotos: conteudo.fotos,
                arquivos: conteudo.arquivos,
                notion: pg.url || "",
                fonte: "notion",
              };
              const tudo = Object.values(conteudo.secoes).join("\n\n");
              if (comum.categoria === "Visão geral do destino") {
                destinos[destId] = { ...comum, id: destId, nome: nomeDestino, titulo: comum.nome, ordem: destOrdem, resumo: tudo };
              } else {
                const ordem = typeof prop(P["Ordem"]) === "number" ? prop(P["Ordem"]) : 999;
                passeios[pg.id.replace(/-/g, "")] = { ...comum, destino: destId, ordem, conteudo: tudo };
                if (!destinos[destId]) destinos[destId] = { id: destId, nome: nomeDestino, ordem: destOrdem, resumo: "", secoes: {}, fotos: [], arquivos: [], pendentes: 0, notion: "", fonte: "notion" };
              }
            }

            // 2b. página Tickets (opcional: se a conexão não foi adicionada, o resto continua)
            let tickets = null, avisoTickets = "";
            if (TICKETS_ID) {
              try { tickets = await lerTickets(TICKETS_ID); }
              catch (e) { avisoTickets = e instanceof Falha && e.status === 404 ? "a conexão “Portal Araya” ainda não foi adicionada à página Tickets do Notion" : "não foi possível ler a página Tickets (" + String((e && e.message) || e).slice(0, 120) + ")"; }
            }

            // 3. grava (substitui por completo) e remove o que saiu do Notion
            let antigosD, antigosP, antigosT = { forEach() {} };
            try {
              [antigosD, antigosP] = await Promise.all([getDocs(collection(db, "destinos")), getDocs(collection(db, "passeios"))]);
              try { antigosT = await getDocs(collection(db, "tickets")); }
              catch (e) { if (tickets) { avisoTickets = "publique as regras novas do Firestore (com a coleção tickets)"; tickets = null; } }
            } catch (e) {
              if (e && e.code === "permission-denied") throw new Falha("O Firebase não deixou o robô mexer nos passeios. Confira se as regras novas do Firestore foram publicadas (com o e-mail do robô).");
              throw e;
            }
            // fotos: só baixa e converte o que é novo ou mudou
            const versaoAntiga = {};
            [antigosD, antigosP, antigosT].forEach((snap) => snap.forEach((d) => { const x = d.data ? d.data() : {}; (x && x.fotos || []).forEach((f) => { versaoAntiga[f.id] = f.versao; }); }));
            const todos = () => [...Object.values(destinos), ...Object.values(passeios), ...Object.values(tickets || {})];
            const todasFotos = todos().flatMap((x) => x.fotos || []);
            let fotosNovas = 0, fotosErro = 0;
            for (const f of todasFotos) {
              if (versaoAntiga[f.id] === f.versao) continue;
              try {
                const img = await prepararFoto(f.url);
                await setDoc(doc(db, "midias", f.id), { dados: img.dados, w: img.w, h: img.h, legenda: f.legenda || "" });
                fotosNovas++;
              } catch (e) {
                if (e && e.code === "permission-denied") throw new Falha("O Firebase não deixou o robô gravar as fotos. Publique as regras novas do Firestore (com a coleção midias).");
                fotosErro++; f.versao = "erro";
              }
            }
            const idsNovos = new Set(todasFotos.map((f) => f.id));
            // se a página Tickets não pôde ser lida, mantém as fotos dela como estão
            if (!tickets) antigosT.forEach((d) => { const x = d.data ? d.data() : {}; (x && x.fotos || []).forEach((f) => idsNovos.add(f.id)); });
            let fotosRemovidas = 0;
            for (const id of Object.keys(versaoAntiga)) if (!idsNovos.has(id)) { try { await deleteDoc(doc(db, "midias", id)); fotosRemovidas++; } catch (_) {} }
            for (const x of todos()) x.fotos = (x.fotos || []).map(({ url, ...resto }) => resto);

            const ops = [];
            for (const [id, d] of Object.entries(destinos)) ops.push(["set", doc(db, "destinos", id), d]);
            for (const [id, p] of Object.entries(passeios)) ops.push(["set", doc(db, "passeios", id), p]);
            let removidos = 0;
            antigosD.forEach((doc) => { if (!destinos[doc.id]) { ops.push(["delete", doc.ref]); removidos++; } });
            antigosP.forEach((doc) => { if (!passeios[doc.id]) { ops.push(["delete", doc.ref]); removidos++; } });
            if (tickets) {
              for (const [id, t] of Object.entries(tickets)) ops.push(["set", doc(db, "tickets", id), t]);
              antigosT.forEach((doc) => { if (!tickets[doc.id]) ops.push(["delete", doc.ref]); });
            }
            for (let i = 0; i < ops.length; i += 400) {
              const lote = writeBatch(db);
              for (const [tipo, ref, dados] of ops.slice(i, i + 400)) tipo === "set" ? lote.set(ref, dados) : lote.delete(ref);
              await lote.commit();
            }

            console.log("Notion: " + paginas.length + " fichas publicadas lidas.");
            console.log("Portal: " + Object.keys(destinos).length + " destinos e " + Object.keys(passeios).length + " passeios gravados; " + removidos + " itens antigos removidos.");
            if (tickets) console.log("Tickets: " + Object.values(tickets).filter((t) => t.tipo === "item").length + " lugares gravados.");
            else if (avisoTickets) console.log("Tickets: não atualizado — " + avisoTickets + ". O resto do portal foi atualizado normalmente.");
            const totalVideos = todos().reduce((n, x) => n + (x.arquivos || []).filter((a) => a.tipo === "video").length, 0);
            console.log("Vídeos do Notion: " + totalVideos + " (links renovados).");
            console.log("Fotos: " + todasFotos.length + " no total; " + fotosNovas + " novas ou alteradas" + (fotosRemovidas ? "; " + fotosRemovidas + " removidas" : "") + ".");
            if (fotosErro) console.log("Atenção: " + fotosErro + " foto(s) não puderam ser convertidas (formato não suportado ou arquivo grande demais). Tente salvar como JPG e subir de novo.");
            if (semDestino) console.log("Atenção: " + semDestino + " ficha(s) publicada(s) sem Destino preenchido ficaram de fora.");
            await terminate(db);
          }

          main().then(() => process.exit(0)).catch((e) => {
            if (e instanceof Falha) console.error("Não deu certo: " + e.message);
            else console.error("Não deu certo: erro inesperado. " + String((e && e.message) || e).slice(0, 300));
            process.exit(1);
          });
          FIM_DO_ROBO
