# Portal da Equipe Araya · robô que copia as fichas do Notion para o portal.
# Roda sozinho a cada 20 minutos (renova os links dos vídeos guardados no Notion) e também pelo botão "Run workflow" (aba Actions).
# Também conta os atendimentos e as campanhas do Helena (mês atual e anterior) pela API
# e lê as planilhas de vendas e de orçamentos do Trevor ligadas no portal.
# As chaves ficam nos segredos do GitHub (NOTION_TOKEN, ROBO_SENHA e HELENA_TOKEN),
# nunca neste arquivo. O registro da execução mostra só contagens, sem conteúdo.
name: Sincronizar fichas do Notion

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sincronizar-notion
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Preparar
        run: npm install --no-save --no-audit --no-fund --loglevel=error firebase@10.14.1 sharp@0.33.5 heic-convert@2.1.0

      - name: Copiar fichas do Notion para o portal
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ROBO_SENHA: ${{ secrets.ROBO_SENHA }}
          HELENA_TOKEN: ${{ secrets.HELENA_TOKEN }}
          ROBO_EMAIL: robo.portal@arayaexpedicoes.com
          NOTION_DATABASE_ID: ead044fa4f87493b86621b16719cf5e8
          NOTION_DATA_SOURCE_ID: e2f3a87a2c084e83906e5393dbbab421
          NOTION_TICKETS_PAGE_ID: 1e065370b06380ae899ad5c8220284ba
        run: |
          cat > sincronizar.cjs <<'FIM_DO_ROBO'
          // Portal da Equipe Araya · robô Notion → Firestore
          // Lê as fichas com Status = Publicado e grava destinos/passeios no Firestore.
          // Não imprime nenhum conteúdo das fichas: só contagens.
          const { initializeApp } = require("firebase/app");
          const { getAuth, signInWithEmailAndPassword } = require("firebase/auth");
          const { getFirestore, collection, doc, getDoc, getDocs, writeBatch, setDoc, deleteDoc, terminate } = require("firebase/firestore");
          const sharp = require("sharp");
          const heicConvert = require("heic-convert");

          // Configuração pública do portal (a mesma que está no index.html; não é segredo).
          const FIREBASE_CONFIG = {
            apiKey: "AIzaSyAUk1EYAL2QPk9IjnoE0Qq0LWbjtkdDx0o",
            authDomain: "portal-araya-expedicoes.firebaseapp.com",
            projectId: "portal-araya-expedicoes",
          };

          const NOTION_VERSION = "2022-06-28";
          const DB_ID = (process.env.NOTION_DATABASE_ID || "").replace(/-/g, "");
          const TICKETS_ID = (process.env.NOTION_TICKETS_PAGE_ID || "").replace(/-/g, "");
          const DS_ID = (process.env.NOTION_DATA_SOURCE_ID || "").replace(/-/g, "");

          const DESTINOS = {
            "Cusco e Machu Picchu": ["cusco-machu-picchu", 1],
            "Patagônia": ["patagonia", 2],
            "Japão": ["japao", 3],
            "Egito e Jordânia": ["egito-jordania", 4],
            "Ushuaia": ["ushuaia", 5],
            "Mendoza": ["mendoza", 6],
            "Atacama e Uyuni": ["atacama-uyuni", 7],
          };
          const SECOES = {
            "descricao": "descricao", "o que inclui": "inclui", "inclui": "inclui",
            "caracteristicas e atencao": "atencao", "atencao": "atencao",
            "gastronomia": "gastronomia", "guia interno": "guia",
            "fotos e videos": "galeria", "fotos": "galeria", "videos": "galeria", "galeria": "galeria",
          };
          const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

          class Falha extends Error { constructor(m, status) { super(m); this.status = status; } }

          async function notion(path, body, versao) {
            for (let tentativa = 1; ; tentativa++) {
              const res = await fetch("https://api.notion.com/v1/" + path, {
                method: body ? "POST" : "GET",
                headers: {
                  "Authorization": "Bearer " + process.env.NOTION_TOKEN,
                  "Notion-Version": versao || NOTION_VERSION,
                  "Content-Type": "application/json",
                },
                body: body ? JSON.stringify(body) : undefined,
              });
              if (res.ok) return res.json();
              if ((res.status === 429 || res.status >= 500) && tentativa < 6) {
                const espera = Number(res.headers.get("retry-after")) || tentativa * 2;
                await sleep(espera * 1000);
                continue;
              }
              let codigo = "";
              try { codigo = (await res.json()).code || ""; } catch (_) {}
              if (res.status === 401) throw new Falha("O Notion recusou a chave (NOTION_TOKEN). Confira se o segredo foi colado inteiro.");
              if (res.status === 404 || codigo === "object_not_found") throw new Falha("O Notion não encontrou o banco de fichas. Confira se a conexão “Portal Araya” foi adicionada ao banco “Fichas de Passeios · Portal Araya” (••• → Conexões).", 404);
              throw new Falha("O Notion respondeu com erro " + res.status + (codigo ? " (" + codigo + ")" : "") + ".");
            }
          }

          // ---------- propriedades ----------
          const texto = (rt) => (rt || []).map((t) => t.plain_text || "").join("").trim();
          function prop(p) {
            if (!p) return null;
            switch (p.type) {
              case "title": return texto(p.title);
              case "rich_text": return texto(p.rich_text);
              case "select": return p.select ? p.select.name : "";
              case "status": return p.status ? p.status.name : "";
              case "multi_select": return (p.multi_select || []).map((o) => o.name);
              case "number": return p.number;
              case "date": return p.date ? p.date.start : "";
              case "people": return (p.people || []).map((u) => u.name || "").filter(Boolean);
              case "last_edited_time": return p.last_edited_time;
              default: return null;
            }
          }

          // ---------- conteúdo da página → markdown simples por seção ----------
          function inline(rt) {
            let out = "";
            for (const t of rt || []) {
              let s = t.plain_text || "";
              if (!s) continue;
              const href = t.href && /^(https?:\/\/|mailto:|tel:)/.test(t.href) ? t.href : "";
              const negrito = t.annotations && t.annotations.bold;
              // quebras de linha dentro do mesmo bloco viram linhas separadas
              s = s.split("\n").map((parte) => {
                if (!parte.trim()) return parte;
                const ini = parte.match(/^\s*/)[0], fim = parte.match(/\s*$/)[0];
                let x = parte.trim();
                if (negrito) x = "**" + x + "**";
                if (href) x = "[" + x.replace(/\*\*/g, "") + "](" + href + ")";
                return ini + x + fim;
              }).join("\n");
              out += s;
            }
            return out.replace(/\*\*\*\*/g, "").replace(/\n[ \t]+/g, "\n").trim();
          }
          // Senhas nunca vão para o portal: ficam só no Notion.
          const semSenhas = (txt) => String(txt || "").replace(/\b(senha|clave|password|contrase[ñn]a)\b\s*:?\s*\S+/gi, "$1: 🔒 ver na página Tickets do Notion");

          // Links de vídeo que o portal consegue tocar na própria ficha.
          function videoDe(url) {
            url = String(url || "");
            let m = url.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
            if (m) return "youtube:" + m[1];
            m = url.match(/drive\.google\.com\/(?:file\/d\/|open\?(?:.*&)?id=|uc\?(?:.*&)?id=)([A-Za-z0-9_-]{20,})/);
            if (m) return "drive:" + m[1];
            m = url.match(/vimeo\.com\/(?:video\/)?(\d{6,})/);
            if (m) return "vimeo:" + m[1];
            return null;
          }
          const nomeArquivo = (url) => { try { return decodeURIComponent(new URL(url).pathname.split("/").pop() || "arquivo"); } catch (_) { return "arquivo"; } };
          const urlDoBloco = (d) => (d && (d.type === "external" ? d.external && d.external.url : d.type === "file" ? d.file && d.file.url : d.url)) || "";

          async function filhos(id) {
            const todos = [];
            let cursor;
            do {
              const r = await notion("blocks/" + id + "/children?page_size=100" + (cursor ? "&start_cursor=" + cursor : ""));
              todos.push(...r.results);
              cursor = r.has_more ? r.next_cursor : null;
            } while (cursor);
            return todos;
          }

          async function lerPagina(pageId) { return lerBlocos(await filhos(pageId)); }
          async function lerBlocos(blocosIniciais) {
            const ficha = { secoes: {}, pendentes: 0, fotos: [], arquivos: [] };
            let atual = "descricao";
            const add = (linha) => { (ficha.secoes[atual] = ficha.secoes[atual] || []).push(linha); };

            async function percorrer(blocos, nivel) {
              const recuo = "  ".repeat(nivel);
              let n = 0;
              for (const b of blocos) {
                const d = b[b.type] || {};
                const rt = d.rich_text;
                const sub = b.has_children && !["child_page", "child_database", "synced_block"].includes(b.type) ? await filhos(b.id) : [];
                if (b.type !== "numbered_list_item") n = 0;
                switch (b.type) {
                  case "heading_1":
                  case "heading_2": {
                    const chave = SECOES[norm(texto(rt))];
                    if (chave && nivel === 0) { atual = chave; break; }
                    add("### " + inline(rt));
                    break;
                  }
                  case "heading_3": add("### " + inline(rt)); break;
                  case "paragraph": {
                    const puro = texto(rt), so = (rt || []).length === 1 && rt[0].href ? rt[0].href : puro;
                    const v = /^https?:\/\/\S+$/.test(so) ? videoDe(so) : null;
                    if (v) { add("[[video:" + v + "]]"); break; }
                    const s = inline(rt); if (s) add(recuo + s); break;
                  }
                  case "bulleted_list_item":
                  case "to_do": add(recuo + "- " + inline(rt)); break;
                  case "numbered_list_item": n++; add(recuo + n + ". " + inline(rt)); break;
                  case "quote": add("> " + inline(rt)); break;
                  case "callout": {
                    const icone = d.icon && d.icon.emoji;
                    const s = inline(rt);
                    const m = s.match(/(\d+)\s*foto/);
                    if (icone === "📷" || /fotos e v[ií]deos entram no portal/i.test(s)) { ficha.pendentes += m ? Number(m[1]) : 0; break; }
                    if (s) add("> " + s);
                    break;
                  }
                  case "toggle": add(recuo + "**" + inline(rt).replace(/\*\*/g, "") + "**"); break;
                  case "table_row": add(recuo + "- " + (d.cells || []).map(inline).filter(Boolean).join(" · ")); break;
                  case "image": {
                    const url = urlDoBloco(d), legenda = texto(d.caption);
                    const v = d.type === "external" ? videoDe(url) : null;
                    if (v) { add("[[video:" + v + (legenda ? "|" + legenda.replace(/[\]|]/g, " ") : "") + "]]"); break; }
                    if (!url) break;
                    const id = b.id.replace(/-/g, "");
                    ficha.fotos.push({ id, versao: (b.last_edited_time || "") + (d.type === "external" ? "|" + url : ""), legenda, url });
                    add("[[foto:" + id + "]]");
                    break;
                  }
                  case "video": case "embed": case "bookmark": case "link_preview": {
                    const url = urlDoBloco(d), legenda = texto(d.caption);
                    const v = videoDe(url);
                    if (v) add("[[video:" + v + (legenda ? "|" + legenda.replace(/[\]|]/g, " ") : "") + "]]");
                    else if (b.type === "video" && d.type === "file" && url) {
                      // vídeo guardado no próprio Notion: o link é temporário e o robô renova a cada rodada
                      const id = b.id.replace(/-/g, "");
                      ficha.arquivos.push({ id, tipo: "video", url, expira: (d.file && d.file.expiry_time) || "", nome: nomeArquivo(url), legenda });
                      add("[[nvideo:" + id + "]]");
                    }
                    else if (/^https?:\/\//.test(url)) add(recuo + "[" + (legenda || url) + "](" + url + ")");
                    break;
                  }
                  case "file": case "pdf": {
                    const url = urlDoBloco(d);
                    if (!url) break;
                    if (d.type === "file") {
                      const id = b.id.replace(/-/g, "");
                      ficha.arquivos.push({ id, tipo: "arquivo", url, expira: (d.file && d.file.expiry_time) || "", nome: d.name || nomeArquivo(url), legenda: texto(d.caption) });
                      add("[[arquivo:" + id + "]]");
                    } else add(recuo + "[" + (texto(d.caption) || d.name || url) + "](" + url + ")");
                    break;
                  }
                  default: break;
                }
                if (sub.length) await percorrer(sub, ["toggle", "table", "column_list", "column"].includes(b.type) ? nivel : nivel + 1);
              }
            }
            await percorrer(blocosIniciais, 0);
            for (const k of Object.keys(ficha.secoes)) {
              const s = ficha.secoes[k].join("\n").replace(/\n{3,}/g, "\n\n").trim();
              if (s) ficha.secoes[k] = s; else delete ficha.secoes[k];
            }
            return ficha;
          }

          // ---------- página Tickets (links e instruções de reserva) ----------
          const DEST_TICKETS = [
            [/^(peru|cusco|machu)/, "cusco-machu-picchu", "Cusco e Machu Picchu", 1], [/^patagonia/, "patagonia", "Patagônia", 2],
            [/^japao/, "japao", "Japão", 3], [/^(egito|jordania)/, "egito-jordania", "Egito e Jordânia", 4],
            [/^ushuaia/, "ushuaia", "Ushuaia", 5], [/^mendoza/, "mendoza", "Mendoza", 6], [/^(atacama|uyuni)/, "atacama-uyuni", "Atacama e Uyuni", 7],
          ];
          async function lerTickets(pageId) {
            const itens = {}, intros = {};
            let atual = null, ordem = 0;
            const juntar = (sec) => ["descricao", "inclui", "atencao", "gastronomia", "guia", "galeria"].map((k) => sec[k]).filter(Boolean).join("\n\n");
            for (const b of await filhos(pageId)) {
              const d = b[b.type] || {}, rt = d.rich_text || [];
              const titulo = texto(rt);
              const primeira = norm(titulo.split("\n")[0]);
              const cab = (b.type === "paragraph" && rt[0] && rt[0].annotations && rt[0].annotations.bold) || /^heading_/.test(b.type);
              const dest = cab && primeira.length <= 30 ? DEST_TICKETS.find(([re]) => re.test(primeira)) : null;
              if (dest && b.type !== "toggle" && !(d.is_toggleable)) {
                atual = dest; ordem = 0;
                const resto = titulo.split("\n").slice(1).join("\n").trim();
                intros[atual[1]] = intros[atual[1]] || { linhas: [], fotos: [], arquivos: [] };
                if (resto) intros[atual[1]].linhas.push(semSenhas(resto));
                continue;
              }
              if (!atual) continue;
              if (b.type === "toggle" || d.is_toggleable) {
                if (/desativad/i.test(titulo)) continue;
                const m = titulo.replace(/\*/g, "").match(/^(.*?)\s*\(([^)]*)\)\s*\.?$/);
                const nome = (m ? m[1] : titulo).replace(/\s*\.\s*$/, "").trim(), obs = m ? m[2].trim() : "";
                const conteudo = b.has_children ? await lerPagina(b.id) : { secoes: {}, fotos: [], arquivos: [] };
                itens["t_" + b.id.replace(/-/g, "")] = { tipo: "item", destino: atual[1], destinoNome: atual[2], destinoOrdem: atual[3], nome, obs, ordem: ++ordem,
                  texto: semSenhas(juntar(conteudo.secoes)), fotos: conteudo.fotos, arquivos: conteudo.arquivos, editadoEm: b.last_edited_time || "" };
                continue;
              }
              // texto solto entre os itens: vai para a introdução do destino
              if (b.type === "divider") continue;
              const tmp = await lerBlocos([b]);
              const intro = intros[atual[1]] = intros[atual[1]] || { linhas: [], fotos: [], arquivos: [] };
              const txt = juntar(tmp.secoes); if (txt) intro.linhas.push(semSenhas(txt));
              intro.fotos.push(...tmp.fotos); intro.arquivos.push(...tmp.arquivos);
            }
            for (const [id, x] of Object.entries(intros)) {
              const dest = DEST_TICKETS.find((t) => t[1] === id);
              itens["intro_" + id] = { tipo: "intro", destino: id, destinoNome: dest[2], destinoOrdem: dest[3], nome: "Como funciona", obs: "", ordem: 0, texto: x.linhas.join("\n\n"), fotos: x.fotos, arquivos: x.arquivos, editadoEm: "" };
            }
            return itens;
          }

          // ---------- fotos: reduz e guarda no banco do portal (protegido pelo login) ----------
          async function prepararFoto(url) {
            const res = await fetch(url);
            if (!res.ok) throw new Error("download " + res.status);
            let buf = Buffer.from(await res.arrayBuffer());
            try { await sharp(buf, { failOn: "none" }).resize(8).toBuffer(); }
            catch (_) {
              // fotos do iPhone (HEIC): converte para JPG antes
              buf = Buffer.from(await heicConvert({ buffer: buf, format: "JPEG", quality: 0.9 }));
            }
            for (const [lado, q] of [[1600, 74], [1400, 68], [1200, 62], [1000, 58], [800, 52]]) {
              const out = await sharp(buf, { failOn: "none" }).rotate()
                .resize({ width: lado, height: lado, fit: "inside", withoutEnlargement: true })
                .webp({ quality: q }).toBuffer({ resolveWithObject: true });
              if (out.data.length <= 650000) return { dados: "data:image/webp;base64," + out.data.toString("base64"), w: out.info.width, h: out.info.height };
            }
            throw new Error("grande demais");
          }

          // ---------- Helena (atendimentos) ----------
          // Conta as conversas que chegaram no Helena em cada mês, por atendente, pela API (token no segredo HELENA_TOKEN).
          // Grava só contagens e o nome/e-mail de cada atendente em helena/mes_AAAA-MM (só a administradora lê).
          const HELENA_API = "https://api.wts.chat/chat/v2/session";
          const addMes = (ym, n) => { let [y, m] = ym.split("-").map(Number); m += n; y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1; return y + "-" + String(m).padStart(2, "0"); };
          const mesSP = (d) => { const x = new Date(d.getTime() - 3 * 3600e3); return x.getUTCFullYear() + "-" + String(x.getUTCMonth() + 1).padStart(2, "0"); };
          async function helena(params) {
            for (let tentativa = 1; tentativa <= 5; tentativa++) {
              let res;
              try { res = await fetch(HELENA_API + "?" + params.toString(), { headers: { Authorization: "Bearer " + process.env.HELENA_TOKEN, Accept: "application/json" } }); }
              catch (_) { await sleep(tentativa * 3000); continue; }
              if (res.status === 429 || res.status >= 500) { await sleep((Number(res.headers.get("retry-after")) || tentativa * 3) * 1000); continue; }
              if (res.status === 401 || res.status === 403) throw new Falha("o Helena recusou o token. Confira o segredo HELENA_TOKEN (gerado em Ajustes > Integrações > Integração via API)");
              if (!res.ok) throw new Falha("o Helena respondeu com erro " + res.status);
              return res.json();
            }
            throw new Falha("o Helena não respondeu depois de 5 tentativas");
          }
          async function contarMesHelena(ym) {
            const ini = ym + "-01T00:00:00-03:00", fim = addMes(ym, 1) + "-01T00:00:00-03:00";
            const porAgente = {}, campanhas = {}; let total = 0, semAtendente = 0, semCampanha = 0, pagina = 1;
            while (pagina <= 300) {
              const p = new URLSearchParams();
              p.set("CreatedAt.After", ini); p.set("CreatedAt.Before", fim); p.set("Type", "INDIVIDUAL");
              p.append("IncludeDetails", "AgentDetails"); p.append("IncludeDetails", "ContactDetails"); p.set("PageSize", "100"); p.set("PageNumber", String(pagina));
              const r = await helena(p);
              const itens = (r && r.items) || [];
              for (const sessao of itens) {
                if (sessao.type === "GROUP") continue;
                total++;
                // campanha (UTM): guarda só a contagem e uma "chave" do nome do contato (primeiro + último nome, sem acento) para cruzar com as vendas
                const u = sessao.utm || null;
                if (u && (u.campaign || u.clid || u.content || u.headline || (u.source && !/^(organic|direct|direto)$/i.test(u.source)))) {
                  const k = [u.source || "", u.campaign || "", u.content || u.headline || ""].join("|");
                  if (!campanhas[k]) campanhas[k] = { source: u.source || "", medium: u.medium || "", campaign: u.campaign || "", content: u.content || "", headline: u.headline || "", n: 0, nomes: [] };
                  campanhas[k].n++;
                  const cd = sessao.contactDetails || {}, nk = chaveNome(cd.name || cd.displayName || cd.fullName || sessao.title || "");
                  if (nk && campanhas[k].nomes.length < 3000 && !campanhas[k].nomes.includes(nk)) campanhas[k].nomes.push(nk);
                } else semCampanha++;
                const a = sessao.agentDetails || null;
                const id = sessao.userId || (a && (a.userId || a.id));
                if (!id) { semAtendente++; continue; }
                const k = String(id);
                if (!porAgente[k]) porAgente[k] = { nome: (a && (a.name || a.shortName)) || "", email: String((a && a.email) || "").toLowerCase(), n: 0 };
                porAgente[k].n++;
                if (!porAgente[k].nome && a) porAgente[k].nome = a.name || a.shortName || "";
              }
              if (!r.hasMorePages || !itens.length) break;
              pagina++; await sleep(200);
            }
            return { mes: ym, total, semAtendente, porAgente, campanhas: Object.values(campanhas).sort((x, y) => y.n - x.n), semCampanha, atualizadoEm: new Date().toISOString() };
          }
          async function sincronizarHelena(db) {
            if (!process.env.HELENA_TOKEN) { console.log("Helena: sem o segredo HELENA_TOKEN no GitHub, pulado."); return; }
            try {
              const agora = mesSP(new Date());
              for (const ym of [addMes(agora, -1), agora]) {
                const d = await contarMesHelena(ym);
                await setDoc(doc(db, "helena", "mes_" + ym), d);
                console.log("Helena " + ym + ": " + d.total + " atendimentos novos, " + Object.keys(d.porAgente).length + " atendentes, " + d.semAtendente + " sem atendente; " + (d.total - d.semCampanha) + " vindos de campanhas (" + d.campanhas.length + " campanhas/anúncios).");
              }
            } catch (e) {
              console.log("Helena: não atualizado — " + ((e && e.message) || e) + ". O resto do portal segue normalmente.");
            }
          }

          // ---------- Trevor (planilhas de vendas e de orçamentos ligadas no portal) ----------
          // A leitura é a mesma do portal (bloco COMUM-TREVOR, copiado do index.html). Só grava quando a planilha mudou,
          // para não gastar as leituras do plano gratuito do Firebase.
